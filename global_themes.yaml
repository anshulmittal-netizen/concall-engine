    discretionary, and BofA prefers mid-sized private banks to large private and state banks.
  evidence: 73% of Q1 FY27 results met or beat estimates (HSBC)
  leaders: ["500180", "532174", "540719", "540716"]
  india: Domestic theme.
  sources:
    - {t: "Outlook Business: HSBC on Q1 FY27 (Aug 2026)", u: "https://www.outlookbusiness.com/corporate/73-of-india-inc-q1-results-beat-or-meet-estimates-says-hsbc"}
