# ---------------------------------------------------------------- Commodities
- market: Commodities
  theme: Copper
  status: leading
  why: >-
    AI data centres use about 27-33 tonnes of copper per megawatt, grids need more, and supply is short after the
    Grasberg disruption. New mines need prices above about $20,000/t, so supply cannot respond quickly.
  evidence: LME record above $14,500/t (Jan 2026); JPMorgan sees a 2026 deficit
  leaders: [FCX, BHP.AX, RIO.L, AA, "500440", "500295"]
  india: Positive for Hindalco / Vedanta; a cost headwind for cable makers unless passed through.
  sources:
    - {t: "Startup Fortune: Copper records and AI data centres (Jun 2026)", u: "https://startupfortune.com/copper-has-broken-records-this-year-and-ai-data-centers-are-the-reason-the-rally-isnt-done/"}

