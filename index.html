<title>Concall Signal Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Carlito:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: research desk. Left rail groups the views by job (Start, Calls, Sectors, Ideas, Help); a sticky bar carries the quarter switch and company search; any company opens in a side panel over the current view. Navy ground, gold kept for the strongest reads. */
:root{
  --bg:#0A1325; --rail:#0C172C; --panel:#101D37; --panel2:#162542; --line:#23365C; --fg:#E7ECF6; --muted:#8E9AB6; --faint:#5F6C8A;
  --gold:#D9AC4C; --goldsoft:rgba(217,172,76,.18); --up:#4DB487; --down:#E5705F; --warn:#E5A33A; --blue:#7FA9EC; --teal:#4EC3B4; --violet:#B28CE2; --rose:#E58FB6; --sand:#E2B39C;
  --onGold:#1A1405; --shadow:0 18px 48px rgba(0,0,0,.45); --scrim:rgba(4,9,20,.6);
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Carlito',Calibri,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#EEF2F8; --rail:#E5EBF4; --panel:#FFFFFF; --panel2:#F3F6FB; --line:#D4DCEA; --fg:#0D1A33; --muted:#55617C; --faint:#8893AA;
  --gold:#9A6B0F; --goldsoft:rgba(214,169,74,.2); --up:#1E8656; --down:#BE3F33; --warn:#A86A10; --blue:#2F63B8; --teal:#167E72; --violet:#7449B5; --rose:#B33E72; --sand:#9A5A3D;
  --onGold:#FFFFFF; --shadow:0 18px 48px rgba(13,26,51,.16); --scrim:rgba(13,26,51,.35); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#EEF2F8; --rail:#E5EBF4; --panel:#FFFFFF; --panel2:#F3F6FB; --line:#D4DCEA; --fg:#0D1A33; --muted:#55617C; --faint:#8893AA;
  --gold:#9A6B0F; --goldsoft:rgba(214,169,74,.2); --up:#1E8656; --down:#BE3F33; --warn:#A86A10; --blue:#2F63B8; --teal:#167E72; --violet:#7449B5; --rose:#B33E72; --sand:#9A5A3D;
  --onGold:#FFFFFF; --shadow:0 18px 48px rgba(13,26,51,.16); --scrim:rgba(13,26,51,.35); color-scheme:light; }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;font-stretch:88%}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-stretch:85%;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- shell ---------- */
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:228px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-block:22px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:34px;height:34px;flex:none;position:relative}
.mark i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:spin 9s linear infinite}
.mark b{position:absolute;inset:11px;border-radius:50%;background:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{font-size:19px;font-weight:800;line-height:1.1}
.brand p{font-size:12.5px;color:var(--muted)}
.nav{display:grid;gap:18px}
.nav-group{display:grid;gap:2px}
.nav-group>.eyebrow{padding:0 10px 4px;font-size:10.5px;color:var(--faint)}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:8px 10px;color:var(--muted);font-family:var(--display);font-stretch:92%;font-weight:600;font-size:14.5px;transition:background .18s,color .18s}
.nav button:hover{background:var(--panel);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--gold)}
.nav .ct{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);background:var(--panel);border-radius:99px;padding:1px 7px}
.nav button[aria-current="page"] .ct{background:var(--goldsoft);color:var(--fg)}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--muted);display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.live{display:inline-flex;align-items:center;gap:7px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 var(--up);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}

.main{min-width:0;display:grid;gap:22px}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line)}
.qwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);max-width:100%;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 12px;font-size:13.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;transition:background .18s,color .18s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--onGold);font-weight:700}
.seg button[aria-pressed="true"] .num{opacity:.85}
.seg .num{font-size:11.5px;opacity:.75}
.prog-dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:inline-block}
.find{position:relative;flex:1 1 240px;max-width:420px;margin-left:auto}
.find input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 34px;font-size:14.5px}
.find svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.find-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px;z-index:25;max-height:60vh;overflow:auto}
.find-res button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px}
.find-res button:hover,.find-res button.on{background:var(--panel2)}
.find-res b{font-family:var(--display);font-stretch:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find-res span{font-size:12.5px;color:var(--muted)}

/* ---------- view frame ---------- */
.view{display:grid;gap:18px;min-width:0;animation:enter .32s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}}
.vhead{display:grid;gap:8px}
.vhead .row{display:flex;gap:10px 16px;align-items:baseline;flex-wrap:wrap}
.vhead h2{font-size:clamp(24px,3vw,30px);font-weight:800;line-height:1.1}
.vhead .purpose{color:var(--muted);max-width:72ch;font-size:15.5px}
.badge{font-size:12px;font-family:var(--mono);padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.warn{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn)}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:900px}
details.how summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:8px;align-items:center;font-family:var(--display);font-stretch:90%;font-weight:600;font-size:14px;color:var(--fg)}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
details.how[open] summary::before{transform:rotate(45deg)}
details.how .body{padding:0 16px 14px 32px;display:grid;gap:8px;font-size:14.5px}
details.how ol,details.how ul{margin:0;padding-left:18px;display:grid;gap:5px}
details.how b{font-weight:700}

/* info tips */
.i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--faint);background:none;color:var(--muted);font:600 10.5px/1 var(--mono);padding:0;vertical-align:1px;margin-left:5px;flex:none;transition:border-color .15s,color .15s}
.i:hover,.i[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
#pop{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 32px));background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:14px;display:grid;gap:6px;animation:enter .18s var(--ease) both}
#pop h4{font-size:15px}
#pop p{color:var(--fg);opacity:.92}

/* ---------- shared bits ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13.5px;transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--onGold);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--blue);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;max-width:100%}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted);transition:all .15s}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--fg);background:var(--goldsoft)}
.count-line{font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-stretch:88%;font-weight:700;font-size:12px;letter-spacing:.04em;padding:2px 9px;border-radius:99px;white-space:nowrap;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent)}
.v-strong{--pc:var(--gold)}.v-good{--pc:var(--up)}.v-avg{--pc:var(--muted)}.v-weak{--pc:var(--warn)}.v-poor{--pc:var(--down)}.v-flag{--pc:var(--down)}
.st-turning{--pc:var(--gold)}.st-emerging{--pc:var(--blue)}.st-confirming{--pc:var(--up)}.st-crowded{--pc:var(--warn)}.st-deteriorating{--pc:var(--down)}.st-neutral{--pc:var(--muted)}
.delta{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)}.delta.dn{color:var(--down)}.delta.zero{color:var(--faint);font-weight:400}
.g-up{color:var(--up)}.g-dn{color:var(--down)}.g-flat{color:var(--muted)}
.sbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;flex:1;min-width:40px}
.sbar i{display:block;height:100%;border-radius:4px;transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.scorecell{display:flex;align-items:center;gap:8px}
.scorecell b{font-family:var(--mono);font-size:15px;min-width:22px}

/* list rows (tables that fold into cards on phones) */
.rows{display:grid;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.r{display:grid;gap:4px 14px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;transition:background .15s}
.r:first-child{border-top:0}
button.r:hover{background:var(--panel2)}
.r.hd{background:var(--panel2);font-family:var(--display);font-stretch:88%;font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-block:9px}
.r .nm{font-family:var(--display);font-weight:700;font-stretch:90%;font-size:15.5px;line-height:1.2}
.r .sub{font-size:12.5px;color:var(--muted)}
.r .why{font-size:13.5px;color:var(--muted);line-height:1.4}
.calls .r{grid-template-columns:34px minmax(0,1.3fr) 150px 84px minmax(0,1fr) minmax(0,1.8fr) 104px 72px}
.r .rk{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.more{display:flex;justify-content:center;gap:12px;align-items:center;padding:6px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.today{background:linear-gradient(130deg,var(--goldsoft),transparent 60%),var(--panel);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:16px;padding:20px 22px;display:grid;gap:14px}
.today h3{font-size:clamp(19px,2.2vw,23px);font-weight:700;line-height:1.25;max-width:40ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:24px;font-weight:600}
.stat span{font-size:12.5px;color:var(--muted)}
.prog{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:9px;transform-origin:left;animation:grow 1.2s var(--ease) both}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font:600 12px var(--mono);color:var(--gold)}
.steps{margin:0;padding:0}
.steps b{font-family:var(--display);font-stretch:90%}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.pick{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start;transition:transform .2s var(--ease),border-color .2s}
.pick:hover{transform:translateY(-2px);border-color:var(--gold)}
.pick strong{font-family:var(--display);font-stretch:90%;font-size:17px;line-height:1.2}
.pick .small{color:var(--muted)}
.pick .go{font-size:12.5px;color:var(--blue)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mini-list .r{grid-template-columns:minmax(0,1fr) auto;padding-block:9px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.list-head h3{font-size:17px}
.welcome{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:12px 16px;font-size:14.5px}

/* ---------- tracker ---------- */
.cov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:center}
.cov .big{font-family:var(--mono);font-size:28px;font-weight:600}
.trk .r{grid-template-columns:minmax(0,1.4fr) 150px 92px 86px 106px minmax(0,1fr) 120px}
.trk .r.sec{cursor:pointer}
.trk .r.subr{background:color-mix(in srgb,var(--panel2) 55%,transparent)}
.trk .r.subr .nm{font-size:14.5px;padding-left:18px}
.caret{display:inline-block;width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:8px;transition:transform .2s;vertical-align:2px}
.open>div>.nm .caret,.r.open .caret{transform:rotate(90deg)}
.c-m{display:none}
.covcell{display:flex;align-items:center;gap:8px}
.covcell .num{font-size:12.5px;white-space:nowrap}
.gidx{font-family:var(--mono);font-weight:600}
.cos{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px 18px;grid-column:1/-1}
.cos button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px}
.cos button:hover{border-color:var(--gold)}
svg text{font-family:var(--mono)}

/* ---------- guidance ---------- */
.gcard{display:grid;gap:10px;align-content:start}
.gcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gcard h4{font-size:17px}
.gauge{position:relative;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--down),var(--panel2) 50%,var(--up))}
.gauge i{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--fg);transform:translateX(-2px);transition:left .8s var(--ease)}
.gauge-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-family:var(--mono)}
.quote-line{font-size:14px;border-left:3px solid var(--gold);padding-left:10px}

/* ---------- turns + themes ---------- */
.turn{display:grid;gap:10px;align-content:start}
.turn.hit{border-color:var(--gold)}
.turn .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.turn h4{font-size:17px}
.brow{display:grid;grid-template-columns:118px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.brow .sbar{height:8px}
.brow .num{text-align:right;font-size:12.5px}
.th .r{grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) 64px 110px}
.thbar{display:flex;align-items:center;gap:8px}

/* ---------- ideas + first ---------- */
.idea{display:grid;gap:8px;align-content:start}
.idea.red{border-color:color-mix(in srgb,var(--down) 55%,var(--line))}
.idea .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.idea h4{font-size:18px}
.idea p{font-size:14px;color:var(--muted)}
.idea .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.first .r{grid-template-columns:minmax(0,1.3fr) 100px 110px 70px minmax(0,1fr) minmax(0,2fr)}

/* ---------- help ---------- */
.help{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}
.help article{display:grid;gap:26px;max-width:78ch}
.help section{display:grid;gap:10px}
.help h3{font-size:21px}
.help p,.help li{font-size:15.5px}
.help ul,.help ol{margin:0;padding-left:20px;display:grid;gap:6px}
.toc{position:sticky;top:90px;display:grid;gap:4px;font-size:14px}
.toc a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:7px}
.toc a:hover{background:var(--panel);color:var(--fg)}
.vguide{display:grid;gap:8px}
.vguide div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.vguide div b{font-family:var(--display);font-stretch:90%}
.weights{display:grid;gap:8px}
.weights .w{display:grid;grid-template-columns:170px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.weights .sbar{height:10px}
.weights .sbar i{background:var(--gold)}
dl.gl{margin:0;display:grid;gap:0}
dl.gl div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
dl.gl dt{font-family:var(--display);font-stretch:90%;font-weight:700}
dl.gl dd{margin:0;color:var(--fg);opacity:.92}
.bands{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- company panel ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;animation:slide .32s var(--ease) both;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:.001}}
.dr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.dr-body{overflow-y:auto;padding:20px 22px 40px;display:grid;gap:20px;align-content:start;overscroll-behavior:contain}
.dr-head h2{font-size:clamp(24px,3.2vw,30px);font-weight:800;line-height:1.08;margin-top:4px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.bigscore{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1}
.vfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.vfacts div{display:grid;gap:1px}
.vfacts span{font-size:12px;color:var(--muted)}
.vfacts b{font-size:15px}
.oneline{padding:14px 16px;border-radius:12px;background:linear-gradient(120deg,var(--goldsoft),transparent 75%);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.oneline p{font-family:var(--display);font-stretch:92%;font-weight:600;font-size:17.5px;line-height:1.35;margin-top:4px}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.dtabs button{background:none;border:0;padding:9px 12px 11px;font-family:var(--display);font-stretch:90%;font-weight:600;font-size:15px;color:var(--muted);position:relative}
.dtabs button[aria-selected="true"]{color:var(--fg)}
.dtabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px;background:var(--gold)}
.sec{display:grid;gap:10px}
.sec>h3{font-size:16px;display:flex;align-items:center}
.fin{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fin div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:1px}
.fin b{font-family:var(--mono);font-size:14.5px}
.fin span{font-size:12px;color:var(--muted)}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.scard h4{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.scard ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14.5px}
.qa{display:grid;gap:8px}
.qa details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.qa summary{cursor:pointer;font-weight:700}
.qa p{margin-top:8px;opacity:.92}
.quotes blockquote{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--gold);font-size:15px}
.trig{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px}
.trig .stripe{border-radius:4px;background:var(--tc)}
.trig strong{font-family:var(--display);font-stretch:90%;font-size:15.5px}
.trig blockquote{margin:5px 0 0;font-size:14.5px;opacity:.9}
.trig blockquote::before{content:"\201C"}.trig blockquote::after{content:"\201D"}
.mini{font-size:11.5px;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);white-space:nowrap;margin-right:6px}
mark.hl{color:inherit;background:color-mix(in srgb,var(--tc) 30%,transparent);border-radius:3px;padding:0 2px}
.t-supply{--tc:var(--gold)}.t-util{--tc:var(--blue)}.t-pricing{--tc:var(--teal)}.t-structure{--tc:var(--violet)}.t-inventory{--tc:var(--sand)}.t-demand{--tc:var(--muted)}.t-guidance{--tc:var(--up)}.t-novelty{--tc:var(--rose)}.t-tone{--tc:var(--down)}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.model{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);font-size:13.5px}
.model b{display:block;font-family:var(--display);font-stretch:90%;font-size:14.5px}
.model span{color:var(--muted)}
.schema{display:grid;gap:7px}
.srow{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13.5px}
.strack{position:relative;height:10px;background:var(--panel2);border-radius:6px}
.strack::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
.sfill{position:absolute;top:0;bottom:0;border-radius:6px;animation:grow .7s var(--ease) both}
.sfill.pos{left:50%;transform-origin:left;background:var(--up)}
.sfill.neg{right:50%;transform-origin:right;background:var(--down)}
.srow .sv{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.scale{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:10px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.scale span:nth-child(2){display:flex;justify-content:space-between}
.flag{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--down) 50%,transparent);background:color-mix(in srgb,var(--down) 9%,transparent);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.copied{font-size:12.5px;color:var(--up)}
.linkbox{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:12px}

/* ---------- responsive ---------- */

}
@media (max-width:760px){
  .r.hd{display:none}
  .calls .r{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"co sc" "why why" "meta meta"}

  .th .r>:nth-child(2){grid-column:1/-1;order:3}
  .first .r{grid-template-columns:minmax(0,1fr) auto}
  .first .r>:nth-child(n+3){grid-column:1/-1}
  .first .r>:nth-child(3),.first .r>:nth-child(4){display:none}
  .vguide div,dl.gl div{grid-template-columns:1fr;gap:2px}
  .weights .w{grid-template-columns:120px minmax(0,1fr) 34px}
  .verdict{grid-template-columns:1fr}
  .dr-body{padding:16px max(16px,env(safe-area-inset-left,0px)) 40px}
  .find{max-width:none;margin-left:0}
  .srow,.scale{grid-template-columns:96px minmax(0,1fr) 26px}
}
@media (min-width:761px){ .c-meta{display:contents} .c-meta .m-only{display:none} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

<script>
const ART_URL = 'https://claude.ai/artifact/Y3XcRY258aCXgadeZKZbh3';

/* ---------- vocabulary ---------- */
const TYPES = {supply:'Supply',util:'Utilisation',pricing:'Pricing',structure:'Industry structure',inventory:'Inventory',demand:'Demand',guidance:'Guidance',novelty:'Something new',tone:'Tone'};
const BLOCKS = [['supply','Supply discipline'],['pricing','Pricing & utilisation'],['structure','Industry structure'],['inventory','Inventory'],['demand','Demand'],['guidance','Guidance'],['novelty','Something new'],['tone','Tone & candour']];
const MODELS = {
  'Capital cycle':'Returns turn when supply growth stops, before demand recovers.',
  'Supply discipline':'Peers deferring capacity keeps pricing intact.',
  'Supply exit':'Capacity leaving the market tightens it for the survivors.',
  'Competitive capex':'Everyone expanding at once usually ends in overcapacity.',
  'Capacity bottleneck':'When capacity is the constraint, price does the adjusting.',
  'Consolidation':'Fewer competitors improve pricing for those that remain.',
  'Operating leverage':'Fixed costs spread over rising volume lift margins faster than sales.',
  'Pricing power':'Price rises stick without losing volume.',
  'Mix shift':'A rising share of higher-margin products lifts blended margins.',
  'Backlog conversion':'Orders already won turn into revenue over the next quarters.',
  'Hidden supplier':'Named in other companies’ calls before the market notices.',
  'China+1':'Customers diversifying away from China move orders to new suppliers.',
  'Customer stickiness':'Validated suppliers are hard to replace in regulated chains.',
  'Import substitution':'Domestic supply replacing imports under policy or cost advantage.',
  'Regulatory moat':'Licences, approvals or standards that keep new entrants out.',
  'Working-capital stress':'Cash stuck in receivables or inventory signals weak bargaining power.',
  'Deleveraging':'Debt paydown shifts value from lenders to equity holders.',
  'Capital allocation shift':'Buybacks, dividends or exits from low-return segments.',
  'Management change':'New leadership resetting strategy, targets or culture.'
};
const IDEA_TYPES = {
  'Divergence':'Scores well above the median call in its own sub-sector. The company is doing something its peers are not.',
  'First mover':'Among the first companies to talk about a theme that is now spreading.',
  'Hidden supplier':'Named as a supplier or partner in at least two other companies’ calls.',
  'Credibility upgrade':'Raised guidance, and management has a record of delivering what it guides.',
  'Red flag':'Something in the call that needs checking before anyone owns or buys the stock.'
};
const GL = {
  score:['Concall Signal Score','0 to 100. How strongly the call points to an improving business, read through the capital-cycle lens. Built from eight readings of the call, weighted: supply 30, pricing & utilisation 20, guidance × credibility 20, new developments & themes 15, demand 10, tone 5. Most calls land between 45 and 65.'],
  verdict:['Verdict','A plain label for the score. Strong 70+, Good 60–69, Average 50–59, Weak 40–49, Poor below 40. Red flag means a veto capped the score at 40.'],
  change:['vs last call','Points gained or lost against the company’s previous call. A dash means this is the first call we have read for the company, so there is nothing to compare yet.'],
  pct:['Rank in quarter','Where the call ranks among all calls read for the same quarter. “Top 10%” means only a tenth of the quarter’s calls scored higher.'],
  cred:['Management credibility','0 to 100: how often past guidance was delivered in later calls. “Untested” means there is no earlier guidance to check yet. Untested scores are trimmed by 15% so new names do not jump the queue.'],
  veto:['Veto','A serious negative (guidance withdrawn without reason, auditor or governance issue, regulatory action) caps the score at 40, however good the rest of the call was.'],
  guidance:['Guidance','What management said about the future in this call. Raised: targets lifted or new positive targets given. Cut: targets lowered or withdrawn. Steady: reiterated or no change.'],
  gidx:['Guidance index','0 to 100 for a group of companies. 50 is neutral. Above 60: more companies raised than cut. Below 40: cuts dominate. Companies whose management has delivered before count for more.'],
  coverage:['Reported','Companies that have held and filed their call this quarter, out of all listed companies below ₹50,000 Cr in that sector.'],
  new:['New','Calls filed in the last day / the last 7 days. The engine reads new filings every night.'],
  avg:['Average score','Mean Concall Signal Score of the calls read in the group this quarter.'],
  breadth:['Breadth','Share of companies in the sub-sector whose call shows the signal. 60% supply discipline means 6 in 10 companies talked about holding back capacity.'],
  stage:['Stage','Turning: supply discipline high and pricing or utilisation now rising while demand talk is still lukewarm. Emerging: a signal rising fast from a low base. Confirming: pricing and demand both strong. Crowded: everyone talks about it. Deteriorating: pricing and demand falling. Baseline: only one quarter read so far, so no trend yet.'],
  themeCount:['Companies discussing','Distinct companies that discussed the theme with substance in their call, not just a passing mention.'],
  first:['First-time callers','Confirmed: the transcript says it is the first or maiden call. Likely: BSE shows no earnings call transcript or analyst / investor meet filing for the company from 2019 until this call.'],
  namedBy:['Named in other calls','Companies whose own transcript names this company, with how they described it: customer, supplier, peer or partner. Only exact full-name matches count.'],
  triggers:['Triggers','Specific statements from the call that could move the thesis. Each comes with the quote it was drawn from, checked word for word against the transcript.'],
  schema:['Signal read','Eight readings of the call, each scored −2 (clearly negative) to +2 (clearly positive). They feed the score.'],
  models:['Mental models','The investing patterns this call fits. A quick way to see what kind of story it is.'],
  archetype:['Archetype','The overall type of story the call tells, such as a cyclical bottoming, a supply-side squeeze or a red flag.'],
  quarter:['Quarter switch','Pick the results season you want to look at. Calls, Best & worst, First-time callers, Sector tracker and Guidance all follow it. Sector turns, Themes and Ideas compare quarters, so they stay on the latest quarter with enough calls. “All” shows each company’s latest call.']
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n ?? 0).toLocaleString('en-IN');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${+d} ${MON[+m - 1]} ${y}`; };
const sdate = s => { if (!s) return ''; const [, m, d] = s.slice(0, 10).split('-'); return `${+d} ${MON[+m - 1]}`; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tip = k => `<button class="i" data-tip="${k}" aria-label="What is ${esc(GL[k]?.[0] || k)}?">?</button>`;
const store = {get(k, d) { try { const v = localStorage.getItem('csd2-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('csd2-' + k, JSON.stringify(v)); } catch (e) {} }};
function verdict(score, veto) {
  if (veto) return {w: 'Red flag', c: 'v-flag'};
  return score >= 70 ? {w: 'Strong', c: 'v-strong'} : score >= 60 ? {w: 'Good', c: 'v-good'} : score >= 50 ? {w: 'Average', c: 'v-avg'} : score >= 40 ? {w: 'Weak', c: 'v-weak'} : {w: 'Poor', c: 'v-poor'};
}
const vcol = (s, veto) => veto ? 'var(--down)' : s >= 70 ? 'var(--gold)' : s >= 60 ? 'var(--up)' : s >= 50 ? 'var(--blue)' : s >= 40 ? 'var(--warn)' : 'var(--down)';
const vpill = (s, veto) => { const v = verdict(s, veto); return `<span class="pill ${v.c}">${v.w}</span>`; };
const scoreCell = (s, veto, i = 0) => `<span class="scorecell"><b style="color:${vcol(s, veto)}">${s}</b><span class="sbar"><i style="width:${s}%;background:${vcol(s, veto)};animation-delay:${Math.min(i, 20) * .02}s"></i></span>${vpill(s, veto)}</span>`;
const dcell = d => d ? `<span class="delta ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : '<span class="delta zero">–</span>';
const gcell = g => g > 0 ? '<span class="g-up">▲ Raised</span>' : g < 0 ? '<span class="g-dn">▼ Cut</span>' : '<span class="g-flat">Steady</span>';
const gword = g => g == null ? '' : g >= 60 ? 'Raising' : g <= 40 ? 'Cutting' : 'Mixed';
const gcol = g => g == null ? 'var(--muted)' : g >= 60 ? 'var(--up)' : g <= 40 ? 'var(--down)' : 'var(--blue)';
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count;
    if (reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now(), step = t => { const p = Math.min(1, (t - t0) / 800); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); });
}

/* ---------- data + state ---------- */
let D = null;
const S = {view: 'home', q: '', calls: {search: '', big: '', sub: '', sort: 'best', chips: new Set(), limit: 50},
  first: {status: ''}, turns: {stage: ''}, ideas: {tab: 'ideas'}, openSec: new Set(), drawer: null};
const byId = {};
const quarters = () => { const m = {}; (D.calls || []).forEach(c => { (m[c.period] = m[c.period] || {label: c.period, key: c.periodKey, n: 0}).n++; });
  return Object.values(m).sort((a, b) => b.key.localeCompare(a.key)); };
const curQ = () => S.q || D.season || 'all';
const inProg = q => (D.inProgress || []).some(x => x.season === q);
function callsQ() {
  const all = D.calls || [];
  if (curQ() !== 'all') return all.filter(c => c.period === curQ());
  const latest = {}; all.forEach(c => { if (!latest[c.id] || c.periodKey > latest[c.id].periodKey) latest[c.id] = c; });
  return Object.values(latest);
}
const trackerQ = () => { const t = D.trackers || {}; return t[curQ()] || t[D.season] || D.tracker || null; };
const callsFor = id => (D.calls || []).filter(x => x.id === id).sort((a, b) => b.periodKey.localeCompare(a.periodKey));
const lastDate = () => (D.calls || []).reduce((m, c) => c.date > m ? c.date : m, '');
function daysBack(n) { const d = new Date(lastDate() || Date.now()); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }

/* ---------- views ---------- */
const VIEWS = [
  {group: 'Start', items: [['home', 'Today'], ['help', 'How to use']]},
  {group: 'Calls', items: [['calls', 'All calls'], ['first', 'First-time callers']]},
  {group: 'Sectors', items: [['tracker', 'Sector tracker'], ['guidance', 'Guidance leaders'], ['turns', 'Sector turns'], ['themes', 'Themes']]},
  {group: 'Ideas', items: [['ideas', 'Ideas & red flags']]}
];
const VNAME = Object.fromEntries(VIEWS.flatMap(g => g.items));
function navCounts() {
  const t = trackerQ(), cq = callsQ();
  return {calls: cq.length, first: (D.firstTimers || []).filter(r => curQ() === 'all' || r.period === curQ()).length,
    tracker: t ? (t.sectors || []).reduce((n, r) => n + r.new1, 0) ? (t.sectors || []).reduce((n, r) => n + r.new1, 0) + ' new' : '' : '',
    guidance: t ? (t.guidanceLeaders || []).length : '', turns: (D.sectors || []).filter(s => s.hit).length || '',
    themes: (D.themes || []).length, ideas: (D.ideas || []).filter(x => !x.red).length};
}
function renderNav() {
  const ct = D ? navCounts() : {};
  $('#nav').innerHTML = VIEWS.map(g => `<div class="nav-group"><span class="eyebrow">${g.group}</span>${g.items.map(([k, n]) =>
    `<button data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}><span>${n}</span>${ct[k] !== undefined && ct[k] !== '' ? `<span class="ct">${esc(ct[k])}</span>` : ''}</button>`).join('')}</div>`).join('');
  if (D) $('#railfoot').innerHTML = `<span class="live">Live BSE filings</span><span>Data updated ${esc(fdate(D.generated))}, ${esc((D.generated || '').slice(11, 16))} IST</span><span>${fmt(D.universe)} companies tracked</span>`;
}
function renderQbar() {
  const qs = quarters(), cur = curQ();
  $('#qsel').innerHTML = qs.map(q => `<button data-q="${esc(q.label)}" aria-pressed="${q.label === cur}" title="${q.n} calls read${inProg(q.label) ? ', season in progress' : ''}">${inProg(q.label) ? '<span class="prog-dot" aria-hidden="true"></span>' : ''}${esc(q.label)} <span class="num">${q.n}</span></button>`).join('') +
    `<button data-q="all" aria-pressed="${cur === 'all'}" title="Each company's latest call">All</button>`;
}
function head(title, purpose, how, badge = '') {
  const open = store.get('how-' + S.view, innerWidth > 760);
  return `<header class="vhead"><div class="row"><h2>${title}</h2>${badge}</div><p class="purpose">${purpose}</p>

/* All calls */
const SORTS = {best: ['Highest score', (a, b) => b.score - a.score], worst: ['Lowest score', (a, b) => a.score - b.score],
  up: ['Biggest improvement', (a, b) => b.delta - a.delta || b.score - a.score], down: ['Biggest drop', (a, b) => a.delta - b.delta || a.score - b.score],
  new: ['Newest first', (a, b) => b.date.localeCompare(a.date) || b.score - a.score]};
const CHIPS = {raised: ['Guidance raised', c => c.g > 0], cut: ['Guidance cut', c => c.g < 0], flag: ['Red flags', c => c.veto], strong: ['Strong or Good (60+)', c => c.score >= 60 && !c.veto]};
function filteredCalls() {
  const f = S.calls, q = f.search.toLowerCase();
  return callsQ().filter(c => (!f.big || c.bigSector === f.big) && (!f.sub || c.sector === f.sub) &&
    [...f.chips].every(k => CHIPS[k][1](c)) &&
    (!q || [c.name, byId[c.id]?.ticker, c.sector, c.bigSector, c.industry, c.top].join(' ').toLowerCase().includes(q))).sort(SORTS[f.sort][1]);
}
function vCalls() {
  const f = S.calls, all = callsQ();
  const bigs = [...new Set(all.map(c => c.bigSector).filter(Boolean))].sort();

  return head('All calls', 'Every concall read for the quarter, ranked. Use it to find the best and worst calls, or to go through your sectors.', `
      <ol><li><b>Choose the quarter</b> at the top. The list shows every call filed and read for it.</li>
      <li><b>Narrow it down</b> with Sector, Sub-sector, the search box or the quick filters (Guidance raised, Red flags…).</li>
      <li><b>Sort</b> by highest score for the best calls, lowest for the worst, Newest for what just came in, or Biggest improvement for companies whose story is getting better.</li>
      <li><b>Click a row</b> to open the company panel with the full call summary.</li></ol>
      <p class="muted">Score columns: the number is the Concall Signal Score ${tip('score')}, the label is its verdict ${tip('verdict')}, and the arrow shows the change since the company’s last call ${tip('change')}.</p>`, qBadge()) + `
    <div class="toolbar">
      <input type="search" id="c-search" placeholder="Search name, sector or keyword" value="${esc(f.search)}" aria-label="Search calls">
      <select id="c-big" aria-label="Sector"><option value="">All sectors</option>${bigs.map(s => `<option ${s === f.big ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      <select id="c-sub" aria-label="Sub-sector"><option value="">All sub-sectors</option>${subs.map(s => `<option ${s === f.sub ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      <select id="c-sort" aria-label="Sort">${Object.entries(SORTS).map(([k, [n]]) => `<option value="${k}" ${k === f.sort ? 'selected' : ''}>${n}</option>`).join('')}</select>
    </div>
    <div class="toolbar">${Object.entries(CHIPS).map(([k, [n]]) => `<button class="chip" data-chip="${k}" aria-pressed="${f.chips.has(k)}">${n}</button>`).join('')}
      ${f.big || f.sub || f.search || f.chips.size ? '<button class="link" id="c-clear">Clear filters</button>' : ''}</div>
    <div id="c-list"></div>`;
}
function fillCalls() {

/* Sector tracker */
function bars14(vals, days) {
  const w = 104, h = 26, max = Math.max(1, ...vals), bw = w / vals.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Calls per day, last 14 days: ${vals.join(', ')}">${vals.map((v, i) => { const bh = v ? Math.max(3, v / max * (h - 2)) : 1.5;
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${i === vals.length - 1 ? 'var(--gold)' : v ? 'var(--blue)' : 'var(--line)'}"><title>${esc(days?.[i] || '')}: ${v}</title></rect>`; }).join('')}</svg>`;
}
function dailyChart(t) {
  const days = t.days || [], secs = t.sectors || [], vals = days.map((_, i) => secs.reduce((n, s) => n + (s.daily?.[i] || 0), 0));
  if (!vals.length) return '';
  const W = 560, H = 150, x0 = 28, x1 = W - 6, y0 = 14, y1 = H - 24, max = Math.max(1, ...vals), step = Math.max(1, Math.ceil(max / 4));
  const top = step * Math.ceil(max / step), bw = (x1 - x0) / vals.length, Y = v => y1 - v / top * (y1 - y0);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calls filed per day over the last 14 days">
    ${ticks.map(v => `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${x0 - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join('')}
    ${vals.map((v, i) => `<rect x="${(x0 + i * bw + 3).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${(y1 - Y(v)).toFixed(1)}" rx="3" fill="${i === vals.length - 1 ? 'var(--gold)' : 'var(--blue)'}" opacity="${v ? 1 : .3}"><title>${esc(fdate(days[i]))}: ${v} calls</title></rect>${v ? `<text x="${(x0 + i * bw + bw / 2).toFixed(1)}" y="${(Y(v) - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--fg)">${v}</text>` : ''}`).join('')}
    <text x="${x0}" y="${H - 6}" font-size="10" fill="var(--muted)">${esc(sdate(days[0]))}</text>
    <text x="${x1}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${esc(sdate(days.at(-1)))}</text></svg>`;
}
function trkRow(r, kind, idx, days) {

  return `<div class="${cls}" ${kind === 'sec' ? `data-sec="${idx}" role="button" tabindex="0" aria-expanded="${S.openSec.has(r.name)}"` : `data-subrow="${idx}"`}>
    <div style="min-width:0"><span class="nm">${kind === 'sec' ? '<span class="caret"></span>' : ''}${esc(r.name)}</span></div>
    <span class="covcell"><span class="num">${r.calls} / ${r.universe}</span><span class="sbar"><i style="width:${r.coverage}%;background:var(--blue)"></i></span></span>

    <span>${r.guidance == null ? '<span class="muted">–</span>' : `<span class="gidx" style="color:${gcol(r.guidance)}">${r.guidance}</span> <span class="small" style="color:${gcol(r.guidance)}">${gword(r.guidance)}</span>`}</span>
    <span style="min-width:0">${r.best ? `<button class="btn" data-open="${esc(r.best.id)}" style="max-width:100%;overflow:hidden;text-overflow:ellipsis">${esc(r.best.name)} · ${r.best.score}</button>` : ''}</span>

    ${kind === 'sub' && S.openSub === r.name && r.companies?.length ? `<div class="cos">${r.companies.map(c => `<button data-open="${esc(c.id)}">${esc(c.name)} · ${c.score}</button>`).join('')}</div>` : ''}
  </div>`;
}
function vTracker() {

    <section class="card cov">
      <div style="display:grid;gap:8px"><span class="eyebrow">${esc(t.season || '')} season so far</span>
        <div><span class="big" data-count="${t.reported}">${fmt(t.reported)}</span> <span class="muted">of ${fmt(t.universe)} companies have held their call</span></div>

/* Sector turns */
const STAGE_ORDER = {turning: 0, emerging: 1, confirming: 2, crowded: 3, deteriorating: 4, neutral: 5};

      <div><b>Sector tracker</b><span>All sectors and sub-sectors: how many companies have reported, what came in today, average score, guidance and best call. Updated daily.</span></div>
      <div><b>Guidance leaders</b><span>Sub-sectors ranked by how strongly management is guiding up, and the weakest ones.</span></div>
      <div><b>Sector turns</b><span>Sub-sectors where supply discipline is building and pricing or utilisation is improving. This is the early sign of a turn.</span></div>

    </div></section>
    <section id="h-quarter"><h3>The quarter switch</h3><p>${esc(GL.quarter[1])} A small orange dot marks a season still in progress.</p></section>
    <section id="h-score"><h3>How the score works</h3>

      <div class="weights">${W.map(([n, w]) => `<div class="w"><span>${n}</span><span class="sbar"><i style="width:${w / 30 * 100}%"></i></span><span class="num">${w}</span></div>`).join('')}</div>

function hlq(q, hl) { const s = esc(q); if (!hl) return s; const h = esc(hl), i = s.indexOf(h); return i < 0 ? s : s.slice(0, i) + `<mark class="hl">${h}</mark>` + s.slice(i + h.length); }

    ${(c.flags || []).length ? `<section class="sec"><h3>Red flags</h3>${c.flags.map(f => `<div class="flag">${esc(f)}</div>`).join('')}</section>` : ''}
    <section class="sec"><h3>Mental models ${tip('models')}</h3><div class="models">${(c.models || []).map(m => `<div class="model"><b>${esc(m)}</b><span>${esc(MODELS[m] || '')}</span></div>`).join('')}</div></section>
    <section class="sec"><h3>The eight readings ${tip('schema')}</h3><div class="schema">
      <div class="scale"><span></span><span><span>−2 negative</span><span>0</span><span>+2 positive</span></span><span></span></div>
      ${BLOCKS.map(([k, lab], i) => { const v = (c.blocks || {})[k] || 0; return `<div class="srow"><span>${lab}</span><span class="strack">${v ? `<span class="sfill ${v > 0 ? 'pos' : 'neg'}" style="width:${Math.abs(v) * 25}%;animation-delay:${i * .05}s"></span>` : ''}</span><span class="sv">${v > 0 ? '+' : ''}${v}</span></div>`; }).join('')}</div></section>
    <div class="two" style="gap:20px">
      <section class="sec"><h3>Score by call</h3>${spark(c.hist, hl)}</section>
      <section class="sec"><h3>Management credibility ${tip('cred')}</h3>${c.credTested === 0 ? '<p><b>Untested.</b> <span class="muted">This builds once guidance from an earlier call can be checked against what was delivered.</span></p>' : `<p><b class="num" style="font-size:22px">${c.cred}</b> <span class="muted">of 100, from ${c.credTested} pieces of past guidance checked.</span></p>`}</section>
    </div>
    ${(c.themes || []).length ? `<section class="sec"><h3>Themes discussed</h3><div class="chips">${c.themes.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></section>` : ''}
    ${(c.namedBy || []).length ? `<section class="sec"><h3>Named in other companies’ calls ${tip('namedBy')}</h3><div class="chips">${c.namedBy.map(n => `<button class="btn" data-open="${esc(n.id)}" title="Called it “${esc(n.as)}” in their ${esc(n.period)} call">${esc(n.name)} · ${esc(n.relation)}</button>`).join('')}</div></section>` : ''}
    ${(c.sources || []).filter(s => s.url).length ? `<section class="sec"><h3>Source documents</h3><div class="chips">${c.sources.filter(s => s.url).map(s => `<a class="tag" style="color:var(--blue)" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.type)} · ${esc(fdate(s.date))} ↗</a>`).join('')}</div></section>` : ''}
  </div>`;
}
async function copyLink() {
  const url = ART_URL + '#co-' + S.drawer.id, out = $('#copied');
  try { await navigator.clipboard.writeText(url); out.textContent = 'Link copied'; setTimeout(() => { if (out) out.textContent = ''; }, 2200); }
  catch (e) { out.innerHTML = `<input class="linkbox" readonly value="${esc(url)}" aria-label="Link to this company">`; const i = out.querySelector('input'); i.focus(); i.select(); }
}

/* ---------- tips popover ---------- */
function showTip(btn) {
  const pop = $('#pop'), k = btn.dataset.tip, g = GL[k]; if (!g) return;
  if (!pop.hidden && pop._for === btn) { hideTip(); return; }
  hideTip(); pop._for = btn; btn.setAttribute('aria-expanded', 'true');
  pop.innerHTML = `<h4>${esc(g[0])}</h4><p>${esc(g[1])}</p>`; pop.hidden = false;
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(16, r.left - 20), innerWidth - pw - 16), top = r.bottom + 8;
  if (top + ph > innerHeight - 12) top = Math.max(12, r.top - ph - 8);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function hideTip() { const pop = $('#pop'); if (pop._for) pop._for.setAttribute('aria-expanded', 'false'); pop.hidden = true; pop._for = null; }

/* ---------- search ---------- */
let findSel = 0;
function renderFind() {
  const q = $('#find').value.trim().toLowerCase(), box = $('#findres');
  if (!q || !D) { box.hidden = true; return; }
  const hits = D.companies.filter(c => (c.name + ' ' + (c.ticker || '') + ' ' + c.id).toLowerCase().includes(q))
    .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || b.score - a.score).slice(0, 8);
  findSel = Math.min(findSel, Math.max(0, hits.length - 1));
  box.innerHTML = hits.length ? hits.map((c, i) => `<button data-open="${esc(c.id)}" class="${i === findSel ? 'on' : ''}"><b>${esc(c.name)}</b><span class="num" style="color:${vcol(c.score, c.veto)}">${c.score}</span><span>${esc(c.sector)} · ${esc(c.period)}</span><span>${esc(c.ticker || '')}</span></button>`).join('')
    : '<span class="small muted" style="padding:8px 10px">No company with a call read matches. Its transcript may not be filed yet.</span>';
  box.hidden = false;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const tipB = t.closest('[data-tip]'); if (tipB) { e.preventDefault(); e.stopPropagation(); showTip(tipB); return; }
  if (!t.closest('#pop')) hideTip();
  if (!t.closest('.find')) $('#findres').hidden = true;
  const op = t.closest('[data-open]');
  if (op) { const k = op.dataset.k; if (op.closest('.find-res')) { $('#find').value = ''; $('#findres').hidden = true; } openCo(op.dataset.open, k || undefined); return; }
  if (t.closest('[data-close]')) { closeCo(); return; }
  const v = t.closest('[data-v]');
  if (v) { if (v.dataset.sort) { S.calls.sort = v.dataset.sort; S.calls.limit = 50; } if (S.drawer) closeCo(); go(v.dataset.v); return; }
  const dis = t.closest('[data-dismiss]'); if (dis) { store.set(dis.dataset.dismiss, false); render(); return; }
  const qb = t.closest('#qsel button'); if (qb) { S.q = qb.dataset.q; S.calls.limit = 50; S.calls.big = S.calls.sub = ''; render(); return; }
  const chip = t.closest('[data-chip]'); if (chip) { const k = chip.dataset.chip; S.calls.chips.has(k) ? S.calls.chips.delete(k) : S.calls.chips.add(k); S.calls.limit = 50; chip.setAttribute('aria-pressed', S.calls.chips.has(k)); render(); return; }
  if (t.closest('#c-clear')) { Object.assign(S.calls, {search: '', big: '', sub: '', limit: 50}); S.calls.chips.clear(); render(); return; }
  if (t.closest('#c-more')) { S.calls.limit += 50; fillCalls(); return; }
  const fs = t.closest('[data-fs]'); if (fs) { S.first.status = fs.dataset.fs; render(); return; }
  const st = t.closest('[data-st]'); if (st) { S.turns.stage = st.dataset.st; render(); return; }
  const it = t.closest('[data-it]'); if (it) { S.ideas.tab = it.dataset.it; render(); return; }
  const sec = t.closest('.trk .r.sec'); if (sec) { const n = S._secs[+sec.dataset.sec].name; S.openSec.has(n) ? S.openSec.delete(n) : S.openSec.add(n); render(); return; }
  const sub = t.closest('.trk .r.subr'); if (sub) { const [i, j] = sub.dataset.subrow.split('-').map(Number), n = S._secs[i].subs[j].name; S.openSub = S.openSub === n ? null : n; render(); return; }
  const dq = t.closest('#dr-q button'); if (dq) { S.drawer.key = dq.dataset.k; drawDrawer(false); return; }
  const dt = t.closest('[data-dt]'); if (dt) { S.drawer.tab = dt.dataset.dt; drawDrawer(false); return; }
  if (t.closest('#copylink')) { copyLink(); return; }
  const j = t.closest('[data-jump]'); if (j) { e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'}); return; }
});
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { e.stopPropagation(); if (S.drawer) closeCo(); go(b.dataset.v); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-how]')) store.set('how-' + d.dataset.how, d.open); }, true);
document.addEventListener('input', e => {
  if (e.target.id === 'c-search') { S.calls.search = e.target.value; S.calls.limit = 50; fillCalls(); }
  if (e.target.id === 'find') { findSel = 0; renderFind(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'c-big') { S.calls.big = e.target.value; S.calls.sub = ''; S.calls.limit = 50; render(); }
  if (id === 'c-sub') { S.calls.sub = e.target.value; S.calls.limit = 50; render(); }
  if (id === 'c-sort') { S.calls.sort = e.target.value; S.calls.limit = 50; fillCalls(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#pop').hidden) { hideTip(); return; } if (!$('#findres').hidden) { $('#findres').hidden = true; return; } if (S.drawer) { closeCo(); return; } }
  if (e.target.id === 'find' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    const items = [...$('#findres').querySelectorAll('button')]; if (!items.length) return;
    if (e.key === 'Enter') { e.preventDefault(); items[findSel]?.click(); return; }
    e.preventDefault(); findSel = (findSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; renderFind(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.trk .r.sec')) { e.preventDefault(); e.target.click(); }
  if (e.key === '/' && !e.target.closest('input,select,textarea')) { e.preventDefault(); $('#find').focus(); }
  if (e.key === 'Tab' && S.drawer) { const f = [...$('.drawer').querySelectorAll('button,a,input,select,[tabindex="0"]')].filter(x => x.offsetParent);
    if (!f.length) return; if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); } }
});
$('#find').addEventListener('focus', renderFind);

/* ---------- boot ---------- */
(async function boot() {
  renderNav();
  let ok = false;
  try { const r = await fetch('data/in.json', {cache: 'no-store'}); if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.companies)) { D = j; ok = true; } } } catch (e) {}
  if (!ok) { $('#view').innerHTML = '<div class="empty">The latest results could not be loaded. Reload the page to try again.</div>'; return; }
  D.companies.forEach(c => { byId[c.id] = c; });
  const h = location.hash.slice(1);
  S.view = RENDER[h] ? h : (RENDER[store.get('view', 'home')] ? store.get('view', 'home') : 'home');
  render();
  if (h.startsWith('co-') && byId[h.slice(3)]) openCo(h.slice(3));
  loadSums();
})();
</script>
