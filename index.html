<title>Concall Signal Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: research floor. A light, airy desk: left rail of views, a sticky quarter bar, and each view opens on a
   board of live widgets (rings, gauges, histograms, heat tiles) before the detailed lists. Ivory paper and forest ink, with a
   soft gold glow for the headline moments; forest green marks what you can act on. The five verdict colours run from
   red through amber and warm grey to leaf green and deep petrol blue, and are used for scores only. */
:root{
  --bg:#FAF7EE; --rail:#F2EDDF; --panel:#FFFFFF; --panel2:#F6F2E6; --line:#E7E0CC; --line2:#D5C9AA;
  --fg:#13231A; --muted:#4A574E; --faint:#848D7E;
  --accent:#1E6B45; --accentsoft:rgba(30,107,69,.09); --onAccent:#FFFFFF; --saffron:#C9961C; --saffronsoft:rgba(214,166,46,.20);
  --v5:#0E6F8A; --v4:#3E9B3A; --v3:#998F85; --v2:#E09A1A; --v1:#D23B2C;
  --up:#2F8A35; --down:#C8352A; --warn:#A86A00;
  --teal:#0E7A70; --violet:#6E45B0; --rose:#B23A68; --sand:#9A5A35;
  --gold:var(--accent); --goldsoft:var(--accentsoft); --blue:var(--accent); --onGold:var(--onAccent);
  --shadow:0 1px 2px rgba(80,36,20,.05),0 10px 30px rgba(120,56,24,.08); --shadow2:0 20px 54px rgba(100,40,20,.18); --scrim:rgba(43,24,32,.34);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --r:15px; --r2:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1914; --rail:#121D17; --panel:#17251D; --panel2:#1D2D24; --line:#2A3D32; --line2:#3B5144;
  --fg:#F5F2E7; --muted:#CBD0C1; --faint:#8F9A89;
  --accent:#6FCF97; --accentsoft:rgba(111,207,151,.14); --onAccent:#0B1A12; --saffron:#E8BA4A; --saffronsoft:rgba(232,186,74,.15);
  --v5:#42AACB; --v4:#7CC45A; --v3:#8C8A80; --v2:#E3A83A; --v1:#F0654F;
  --up:#7CC45A; --down:#F0654F; --warn:#F0BE5C;
  --teal:#5AD6C6; --violet:#C9A6F2; --rose:#F08FB0; --sand:#F0C2A8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow2:0 20px 54px rgba(0,0,0,.55); --scrim:rgba(10,4,8,.62);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1914; --rail:#121D17; --panel:#17251D; --panel2:#1D2D24; --line:#2A3D32; --line2:#3B5144;
  --fg:#F5F2E7; --muted:#CBD0C1; --faint:#8F9A89;
  --accent:#6FCF97; --accentsoft:rgba(111,207,151,.14); --onAccent:#0B1A12; --saffron:#E8BA4A; --saffronsoft:rgba(232,186,74,.15);
  --v5:#42AACB; --v4:#7CC45A; --v3:#8C8A80; --v2:#E3A83A; --v1:#F0654F;
  --up:#7CC45A; --down:#F0654F; --warn:#F0BE5C;
  --teal:#5AD6C6; --violet:#C9A6F2; --rose:#F08FB0; --sand:#F0C2A8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow2:0 20px 54px rgba(0,0,0,.55); --scrim:rgba(10,4,8,.62);
  color-scheme:dark; }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 520px at 90% -12%,var(--saffronsoft),transparent 55%) fixed,var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 61px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--body);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:11px}

/* ---------- shell ---------- */
.app{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:216px minmax(0,1fr);gap:30.5px;align-items:start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-block:22px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center}
.mark{width:36px;height:36px;flex:none;position:relative}
.mark i{position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;animation:spin 7s linear infinite}
.mark b{position:absolute;inset:11px;border-radius:50%;background:var(--saffron);animation:breathe 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.72);opacity:.75}}
.brand h1{font-size:16px;font-weight:700;line-height:1.1}
.brand p{font-size:10.5px;color:var(--muted)}
.nav{display:grid;gap:17px}
.nav-group{display:grid;gap:2.5px}
.nav-group>.eyebrow{padding:0 10px 5px;font-size:8.5px;color:var(--faint)}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:7px;width:100%;text-align:left;background:none;border:0;border-radius:11px;padding:7.5px 10px;color:var(--muted);font-weight:600;font-size:12px;transition:background .2s,color .2s,transform .2s var(--ease)}
.nav button:hover{background:var(--panel);color:var(--fg);transform:translateX(2px)}
.nav button[aria-current="page"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.nav button[aria-current="page"]>span:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--accent));margin-right:7.5px;vertical-align:1px}
.nav .ct{font-family:var(--mono);font-size:9px;font-weight:500;color:var(--muted);background:var(--rail);border-radius:99px;padding:1px 7px;white-space:nowrap}
.nav button[aria-current="page"] .ct{background:var(--accentsoft);color:var(--accent)}
.rail-foot{margin-top:auto;font-size:10.5px;color:var(--muted);display:grid;gap:5px;border-top:1px solid var(--line);padding-top:13.5px}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--fg);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 var(--up);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.main{min-width:0;display:grid;gap:24px}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;gap:10px 15.5px;align-items:center;flex-wrap:wrap;padding-block:13.5px}
.qwrap{display:flex;align-items:center;gap:8.5px;flex-wrap:wrap;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:100%;flex-wrap:wrap;padding:2.5px;gap:2px;box-shadow:var(--shadow)}
.seg button{background:none;border:0;border-radius:9px;padding:6px 11px;font-size:11px;font-weight:600;color:var(--muted);display:inline-flex;gap:5px;align-items:center;transition:background .2s,color .2s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.seg .num{font-size:9.5px;opacity:.7;font-weight:500}
.prog-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;animation:breathe 2s ease-in-out infinite}
.find{position:relative;flex:1 1 260px;max-width:440px;margin-left:auto}
.find input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8.5px 12px 8.5px 32.5px;font-size:12px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.find input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accentsoft)}
.find svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.theme-seg{flex:none}.theme-seg button{padding:6px 9px}.theme-seg svg{display:block}
@media (max-width:760px){.theme-seg span{display:none}}
.find-res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:5px;display:grid;gap:2px;z-index:25;max-height:60vh;overflow:auto;animation:enter .2s var(--ease) both}
.find-res button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8.5px;text-align:left;background:none;border:0;border-radius:10px;padding:7.5px 9.5px}
.find-res button:hover,.find-res button.on{background:var(--panel2)}
.find-res b{font-family:var(--display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find-res span{font-size:10.5px;color:var(--muted)}

/* ---------- view frame ---------- */
.view{display:grid;gap:22px;min-width:0;animation:enter .4s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}}
.view>*{animation:rise .55s var(--ease) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{transform:translateY(14px);opacity:.001}}
.vhead{display:grid;gap:8.5px}
.vhead .row{display:flex;gap:8.5px 13.5px;align-items:center;flex-wrap:wrap}
.vhead h2{font-size:clamp(23.5px,3.4vw,31.5px);font-weight:700;line-height:1.08}
.vhead .purpose{color:var(--muted);max-width:68ch;font-size:13px}
.badge{font-size:10px;font-family:var(--mono);padding:2.5px 8.5px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);max-width:920px}
details.how summary{list-style:none;cursor:pointer;padding:9.5px 13.5px;display:flex;gap:7px;align-items:center;font-weight:600;font-size:11.5px;color:var(--fg)}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .25s var(--ease);margin-right:3.5px}
details.how[open] summary::before{transform:rotate(45deg)}
details.how .body{padding:0 15.5px 13.5px 29px;display:grid;gap:7px;font-size:12px}
details.how ol,details.how ul{margin:0;padding-left:15.5px;display:grid;gap:5px}
details.how b{font-weight:700}

/* info tips + hover tooltip */
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font:600 8.5px/1 var(--mono);padding:0;vertical-align:1px;margin-left:4px;flex:none;transition:border-color .15s,color .15s}
.i:hover,.i[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
#pop{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:11px 13px;font-size:11.5px;display:grid;gap:5px;animation:enter .18s var(--ease) both}
#pop h4{font-size:12.5px}
#tt{position:fixed;z-index:70;pointer-events:none;background:var(--fg);color:var(--panel);border-radius:10px;padding:6px 8.5px;font-size:10.5px;line-height:1.4;max-width:260px;box-shadow:var(--shadow2);transition:opacity .12s;white-space:pre-line}
#tt b{font-family:var(--mono)}

/* ---------- shared bits ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,273px),1fr));gap:13.5px}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 11px;font-size:11px;font-weight:600;transition:border-color .15s,background .15s,transform .15s var(--ease);white-space:nowrap;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--onAccent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:11.5px;font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 9.5px;font-size:11.5px;max-width:100%;color:var(--fg)}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:11px;font-weight:500;color:var(--muted);transition:all .18s var(--ease)}
.hd-why{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;max-width:340px}.hd-why .tag{font-size:9px;padding:1px 6px}.hd-s{font-size:15px;font-weight:700;color:var(--accent)}
.chip:hover{border-color:var(--line2);color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accentsoft)}
.count-line{font-size:11px;color:var(--muted)}
.empty{padding:27px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:var(--r)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:9.5px;letter-spacing:.03em;padding:2.5px 8.5px;border-radius:99px;white-space:nowrap;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent)}
.v-strong{--pc:var(--v5)}.v-good{--pc:var(--v4)}.v-avg{--pc:var(--muted)}.v-weak{--pc:var(--warn)}.v-poor{--pc:var(--v1)}.v-flag{--pc:var(--v1)}
.st-turning{--pc:var(--v5)}.st-emerging{--pc:var(--accent)}.st-confirming{--pc:var(--up)}.st-crowded{--pc:var(--warn)}.st-deteriorating{--pc:var(--down)}.st-neutral{--pc:var(--muted)}
.delta{font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)}.delta.dn{color:var(--down)}.delta.zero{color:var(--faint);font-weight:400}
.g-up{color:var(--up)}.g-dn{color:var(--down)}.g-flat{color:var(--muted)}
.sbar{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;flex:1;min-width:40px;box-shadow:inset 0 0 0 1px var(--line)}
.sbar i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.scorecell{display:flex;align-items:center;gap:7.5px}
.scorecell b{font-family:var(--mono);font-size:13px;min-width:24px}

/* list rows (tables that fold into cards on phones) */
.rows{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.r{display:grid;gap:3.5px 13.5px;align-items:center;padding:12px 15.5px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;transition:background .18s}
.r:first-child{border-top:0}
button.r{position:relative}
button.r:hover{background:var(--panel2)}
button.r::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);transform:scaleY(0);transition:transform .2s var(--ease)}
button.r:hover::after{transform:scaleY(1)}
.r.hd{background:var(--panel2);font-weight:600;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:9.5px}
.r .nm{font-family:var(--display);font-weight:600;font-size:13px;line-height:1.25}
.r .sub{font-size:11px;color:var(--muted)}
.r .why{font-size:11px;color:var(--muted);line-height:1.45}
.calls .r{grid-template-columns:34px minmax(0,1.3fr) 170px 84px minmax(0,1fr) minmax(0,1.8fr) 104px 72px}
.r .rk{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.more{display:flex;justify-content:center;gap:10px;align-items:center;padding:7px}

/* ---------- widgets ---------- */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15.5px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 18.5px;box-shadow:var(--shadow);display:grid;gap:12px;align-content:start;min-width:0;transition:transform .25s var(--ease),box-shadow .25s}
.w:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.w.span3{grid-column:span 3}.w.span4{grid-column:span 4}.w.span5{grid-column:span 5}.w.span6{grid-column:span 6}.w.span7{grid-column:span 7}.w.span8{grid-column:span 8}.w.span12{grid-column:span 12}
.w-head{display:flex;justify-content:space-between;align-items:baseline;gap:8.5px}
.w-head h3{font-size:14px;font-weight:600}
.w-foot{display:flex;justify-content:space-between;align-items:center;gap:8.5px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.kpi{display:grid;gap:5px;align-content:start}
.kpi .v{font-family:var(--display);font-size:clamp(28.5px,3.6vw,38px);font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--muted)}
.kpi svg{width:100%;height:42px;display:block}
.ring-wrap{display:flex;align-items:center;gap:15.5px}
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1.3s var(--ease)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ctr b{font-family:var(--display);font-size:21.5px;font-weight:700;line-height:1}
.ring .ctr span{font-size:9px;color:var(--muted)}
.ring .ctr b span{font-size:inherit}
[hidden]{display:none!important}
.legend{display:grid;gap:6px;font-size:11px;min-width:0}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:7px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .num{color:var(--muted)}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--mono);fill:var(--muted);font-weight:500}
.chart .bar{transform-origin:bottom;transform-box:fill-box;animation:growY .9s var(--ease) both}
@keyframes growY{from{transform:scaleY(0)}}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart .bar:hover{filter:brightness(1.12)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.tile{position:relative;text-align:left;border:0;border-radius:13px;padding:10px 11px 9.5px;background:color-mix(in srgb,var(--tc) var(--tp,20%),var(--panel));color:var(--fg);display:grid;gap:2.5px;min-height:86px;align-content:space-between;transition:transform .2s var(--ease),box-shadow .2s;animation:pop .5s var(--ease) both;overflow:hidden}
.tile:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow2);z-index:1}
.tile b{font-family:var(--display);font-weight:600;font-size:11.5px;line-height:1.2}

@media (max-width:760px){.th2 .r{grid-template-columns:minmax(0,1fr) auto}.th2 .r>:nth-child(3),.th2 .r>:nth-child(4),.th2 .r>:nth-child(5){display:none}.th2 .r.hd{display:none}
  .th-co .r{grid-template-columns:minmax(0,1fr) auto}.th-co .r>:nth-child(2){grid-column:1/-1;order:2}.th-co .r>:nth-child(3){grid-column:1/-1;order:3}.th-co .r>:nth-child(4){order:1}.th-co .r>:nth-child(5){grid-column:1/-1;order:4;justify-content:flex-start}.th-co .r.hd{display:none}}

/* ---------- data + state ---------- */

  first: {status: ''}, rc: {big: '', search: '', read: false, watch: false, days: 14}, hd: {big: '', search: '', stage: 'notrerated', cap: 8000, min: 7, nocall: false, limit: 50}, rs: {big: '', search: '', days: 7, sort: 'filed', dir: -1, chips: new Set(), limit: 100, climit: 36, view: 'cards', flip: new Set()}, up: {big: '', search: '', earn: true, read: false, watch: false, days: 14}, turns: {stage: ''}, ideas: {tab: 'ideas'}, near: {big: '', tier: '', chips: new Set(), limit: 30}, pd: {size: '', days: 14, tier: 'strong', post: 14}, cy: {lvl: 'sub', sort: 'phase', thin: false, ph: '', sel: null, size: '', sig: '', csort: 'cyc'}, th: {sort: 'signal', broad: false, niche: false, sel: null, size: '', sec: '', raised: false, csort: 'score'}, inf: {side: 'up', big: '', sharp: false, pending: false, limit: 30}, mg: {days: 30, top: true, inCalls: false}, ask: {q: '', scope: 'latest', big: '', depth: 40, busy: false, res: null, err: '', stage: '', tab: 'match', limit: 30, plan: null}, openSec: new Set(), drawer: null};

/* ---------- widgets: small SVG charts built from the theme tokens ---------- */

function donut(counts, {size = 150, stroke = 22, center = '', sub = ''} = {}) {

/* score distribution: 5-point bins, coloured by verdict band */
function histogram(scores, {h = 170} = {}) {

/* columns per day, last 14 days */
function pace(days, vals, {h = 170} = {}) {

  mup: ['Margin up YoY', r => r.opm != null && r.opm_prev_yoy != null && r.opm > r.opm_prev_yoy], pxup: ['Price up since results', r => r.px?.move > 0], pxdn: ['Price down since results', r => r.px?.move < 0], read: ['Companies we have read', r => !!byId[r.id]], watch: ['★ My watchlist', r => isW(r.id)]};

/* Hidden turnarounds: the Hindusthan Insulators pattern. A small company whose latest results show revenue

const hdCap = r => { const v = byId[r.id]?.mcapCr; if (v != null) return v; const m = String(r.mcap || '').replace(/[^\d.]/g, ''); return m ? +m : null; };

  add(dm >= 10 ? 3 : dm >= 5 ? 2 : dm >= 2 ? 1 : 0, `Margin ${r.opm_prev_yoy.toFixed(0)}→${r.opm.toFixed(0)}%`);
  add((r.op_yoy ?? 0) >= 100 ? 1 : 0, `EBITDA ${pctS(r.op_yoy)}`);

/* Results to watch (PEAD): a pre-results shortlist read from each company's last concall, then which shortlisted names
   beat and rose on day 1. Rebuilt in the browser from in.json and results_in.json, so it follows every refresh. */
const PEAD_MIN = 76, PEAD_WATCH = 70, PEAD_BEAT = 20;
/* words in the last call's read that say last quarter was flattered or will not repeat */
const PEAD_CAUTION = /\b(inventory gains?|one-?offs?|one-?time|temporary|non-structural|weak[- ]base|normali[sz]\w*|slightly lower|surcharge|furnace|price-led|flattered)\b/i;
const peadPts = (call, score) => score + (call.g > 0 ? 6 : 0) + (call.gRaised > 0 ? 6 : 0) - (call.gCut > 0 ? 8 : 0);
const sizeOf = m => Object.keys(SIZES).find(k => SIZES[k][1](m)) || '';
const SIZE_SHORT = {mid: 'Mid cap', small: 'Small cap', micro: 'Micro cap'};
function peadQs() {
  const rs = RES.data?.results || [];
  const rq = rs.reduce((m, r) => r.period > m ? r.period : m, '');
  if (!rq) return null;
  const [y, m] = rq.split('-').map(Number), pm = m > 3 ? m - 3 : m + 9, py = m > 3 ? y : y - 1;
  const cq = `${py}-${String(pm).padStart(2, '0')}`;
  return {rq, cq, lab: (D.calls || []).find(c => c.periodKey === cq)?.period || '', rlab: rs.find(r => r.period === rq)?.label || ''};
}
let PEAD_CACHE = null;
function peadData() {
  if (!RES.data || !D) return null;
  const t0 = istToday();
  if (PEAD_CACHE && PEAD_CACHE.d === D && PEAD_CACHE.r === RES.data && PEAD_CACHE.t === t0) return PEAD_CACHE.v;
  const Q = peadQs(); if (!Q) return null;
  const rs = (RES.data.results || []).filter(r => r.period === Q.rq), posted = new Map(rs.map(r => [r.id, r]));
  /* how each sector is reporting so far this season */
  const secv = {}; rs.forEach(r => { if (!r.bank && r.pat_yoy != null && r.sector) (secv[r.sector] = secv[r.sector] || []).push(Math.max(-100, Math.min(300, r.pat_yoy))); });
  const secMed = s => secv[s]?.length >= 5 ? {m: median(secv[s]), n: secv[s].length} : null;
  const up = {}; (RES.data.calendar || []).forEach(x => { if (x.date >= t0 && !posted.has(x.id) && (!up[x.id] || x.date < up[x.id].date)) up[x.id] = x; });
  const pre = [];
  Object.values(up).forEach(x => {
    const c = byId[x.id]; if (!c || c.periodKey !== Q.cq) return;
    const m = c.mcapCr; if (!(m > 0 && m < 50000) || c.veto || (c.flags || []).length) return;
    const call = callOf(c.id, c.period) || {}, p = peadPts(call, c.score);
    if (p < PEAD_WATCH) return;
    const gr = c.growth || {}, b = c.blocks || {}, plus = [], hard = [], soft = [];
    if (call.gRaised > 0) plus.push('Guidance raised'); else if (call.g > 0) plus.push('Guidance positive');
    const near = (gr.adds || []).filter(a => a.q != null && a.q <= 1 && a.mat !== 'minor' && !['deferred', 'planned'].includes(a.status));
    if (near.length) plus.push(near.some(a => a.q === 0) ? 'New capacity already live' : 'Capacity going live this quarter');
    if (gr.growth >= 20) plus.push(`Growth guided ~${Math.round(gr.growth)}%`);
    if (gr.qRev >= 20) plus.push(`Last quarter revenue +${Math.round(gr.qRev)}%`);
    if ((gr.util || 0) >= 85) plus.push(`Utilisation ~${Math.round(gr.util)}%`);
    if ((b.demand || 0) >= 2) plus.push('Strong demand');
    const sm = secMed(c.sector);
    if (sm && sm.m >= 25) plus.push(`Sector reporting well: median profit ${pctS(sm.m)} (${sm.n} in)`);
    if (call.gCut > 0) hard.push('Guidance cut on the last call');
    if (c.planFlag) hard.push('Big guidance without a clear plan');
    const cm = [c.thesis, gr.why, c.top].filter(Boolean).join(' ').match(PEAD_CAUTION);
    if (cm) hard.push(`Last quarter may not repeat (“${cm[0]}”)`);
    if (sm && sm.m < 5) soft.push(`Sector reporting weak: median profit ${pctS(sm.m)} (${sm.n} in)`);
    const tier = hard.length ? 'skip' : p >= PEAD_MIN && plus.length >= 2 && !soft.length ? 'strong' : 'watch';
    pre.push({c, call, x, p, plus, minus: [...hard, ...soft], tier, near, size: sizeOf(m)});

  pre.sort((a, b) => a.x.date.localeCompare(b.x.date) || b.p - a.p);
  /* names already reported this season, read from the call before their results */
  const post = [];
  rs.forEach(r => {
    const c = byId[r.id], call = c && callOf(r.id, Q.lab); if (!call) return;
    const m = c.mcapCr; if (!(m > 0 && m < 50000)) return;
    const p = peadPts(call, call.score), px = r.px || {};
    const beat = r.pat_yoy != null ? r.pat_yoy >= PEAD_BEAT : (r.pat > 0 && r.rev_yoy >= PEAD_BEAT);
    const st = !px.reactDate ? ['wait', 'Market reacts next session', ''] : beat && px.react > 0 ? ['ok', 'Beat · up on day 1', 'ok'] : beat ? ['meh', 'Beat · market not convinced', 'meh'] : ['bad', 'No beat', 'bad'];
    post.push({c, call, r, p, beat, px, st, size: sizeOf(m), drift: px.reactDate && px.nowDate > px.reactDate ? px.move - px.react : null, pick: p >= PEAD_MIN && !call.veto});

function peadTrack(post) {

    <section id="h-quarter"><h3>The quarter switch</h3><p>${esc(GL.quarter[1])} A small orange dot marks a season still in progress.</p></section>
    <section id="h-score"><h3>How the score works</h3>
      <p>The Concall Signal Score runs from 0 to 100. The model reads the call into eight readings, each from −2 to +2, plus a growth reading (growth or turnaround guided, how management plans to deliver it, capacity coming live, utilisation, this quarter’s growth), and they are combined with these weights:</p>

      <ul><li>For a company’s first call in our data, the score reflects where the business stands now. From the second call on, 60% is the level and 40% is the change since last call.</li>

function sbHow(p, mode) {

    results: 'This quarter’s revenue and EBITDA growth YoY, each scored ≥30% 1.0, ≥20% 0.85, ≥10% 0.7, 0–10% 0.5, 0 to −10% 0.3, below −10% 0.1, and averaged. Not stated counts as neutral 0.5.',
    supply: `${lvl} Supply discipline counts twice, structure and inventory once each: (2 × supply + structure + inventory) ÷ 4.`,
    pricing: `${lvl} Pricing and utilisation are averaged.`,
    guidance: `${lvl} The guidance value is then pulled toward neutral (0.5) unless management has delivered before: value = 0.5 + (reading − 0.5) × credibility factor. Factor = 0.4 + 0.6 × credibility/100 once tested, 0.85 while untested.`,
    novelty: `${lvl} Averaged with a theme bonus for the strongest theme the company discussed: Emerging 1.0, Confirming 0.7, Steady or none 0.5, Crowded 0.25, Fading 0.2.`,

      <span class="small muted">${b.mode === 'blend' ? `Compared with the company’s ${b.prevCalls} earlier call${b.prevCalls === 1 ? '' : 's'} on record: 60% level, 40% change.` : 'First call on record for this company, so the score reflects where the business stands now; change starts counting from the next call.'}</span>
    </section>
    ${b.parts.map(p => { const [cls, , types] = SB_PART[p.key] || ['', 0, []], max = Math.round(p.w * 100), ev = trig(types);

        <tr><td>Demand</td><td>5%</td><td>Demand reading</td></tr>

function showTip(btn) {
  const pop = $('#pop'), k = btn.dataset.tip, g = GL[k]; if (!g) return;
  if (!pop.hidden && pop._for === btn) { hideTip(); return; }
  hideTip(); pop._for = btn; btn.setAttribute('aria-expanded', 'true');
  pop.innerHTML = `<h4>${esc(g[0])}</h4><p>${esc(g[1])}</p>`; pop.hidden = false;
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(16, r.left - 20), innerWidth - pw - 16), top = r.bottom + 8;
  if (top + ph > innerHeight - 12) top = Math.max(12, r.top - ph - 8);

let findSel = 0;
function renderFind() {
  const q = $('#find').value.trim().toLowerCase(), box = $('#findres');
  if (!q || !D) { box.hidden = true; return; }
  const hits = D.companies.filter(c => (c.name + ' ' + (c.ticker || '') + ' ' + c.id).toLowerCase().includes(q))
    .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || b.score - a.score).slice(0, 8);
  findSel = Math.min(findSel, Math.max(0, hits.length - 1));

  if (t.closest('#if-more')) { S.inf.limit += 30; render(); return; }
  const sec = t.closest('.trk .r.sec'); if (sec) { const n = S._secs[+sec.dataset.sec].name; S.openSec.has(n) ? S.openSec.delete(n) : S.openSec.add(n); render(); return; }
  const sub = t.closest('.trk .r.subr'); if (sub) { const [i, j] = sub.dataset.subrow.split('-').map(Number), n = S._secs[i].subs[j].name; S.openSub = S.openSub === n ? null : n; render(); return; }
  const dq = t.closest('#dr-q button'); if (dq) { S.drawer.key = dq.dataset.k; drawDrawer(false); return; }
  const dt = t.closest('[data-dt]'); if (dt) { S.drawer.tab = dt.dataset.dt; drawDrawer(false); return; }
  if (t.closest('#copylink')) { copyLink(); return; }
  const j = t.closest('[data-jump]'); if (j) { e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'}); return; }
});
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { e.stopPropagation(); if (S.drawer) closeCo(); go(b.dataset.v); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-how]')) store.set('how-' + d.dataset.how, d.open); }, true);
document.addEventListener('input', e => {
  if (e.target.id === 'ppl-search') { const pos = e.target.selectionStart; S.ppl = {...(S.ppl || {type: '', open: ''}), search: e.target.value}; render(); const i = $('#ppl-search'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }
  for (const [id, st] of [['rc-search', S.rc], ['rs-search', S.rs], ['hd-search', S.hd]]) if (e.target.id === id) { const pos = e.target.selectionStart; st.search = e.target.value; render(); const i = $('#' + id); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }
  if (e.target.id === 'up-search') { const v = e.target.value, pos = e.target.selectionStart; S.up.search = v; render(); const i = $('#up-search'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }
  if (e.target.id === 'c-search') { S.calls.search = e.target.value; S.calls.limit = 50; fillCalls(); }
  if (e.target.id === 'find') { findSel = 0; renderFind(); }
  if (e.target.id === 'ask-q') S.ask.q = e.target.value;
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'c-big') { S.calls.big = e.target.value; S.calls.sub = ''; S.calls.limit = 50; render(); }
  if (id === 'c-sub') { S.calls.sub = e.target.value; S.calls.limit = 50; render(); }
  if (id === 'c-size') { S.calls.size = e.target.value; S.calls.limit = 50; render(); }
  if (id === 'mg-days') { S.mg.days = +e.target.value; render(); }
  if (id === 'up-big') { S.up.big = e.target.value; render(); }
  if (id === 'up-days') { S.up.days = +e.target.value; render(); }
  if (id === 'rc-big') { S.rc.big = e.target.value; render(); }
  if (id === 'rc-days') { S.rc.days = +e.target.value; render(); }
  if (id === 'hd-big') { S.hd.big = e.target.value; S.hd.limit = 50; render(); }
  if (id === 'hd-stage') { S.hd.stage = e.target.value; S.hd.limit = 50; render(); }
  if (id === 'hd-cap') { S.hd.cap = +e.target.value; S.hd.limit = 50; render(); }
  if (id === 'hd-min') { S.hd.min = +e.target.value; S.hd.limit = 50; render(); }
  if (id === 'rs-big') { S.rs.big = e.target.value; S.rs.limit = 100; render(); }
  if (id === 'rs-days') { S.rs.days = +e.target.value; S.rs.limit = 100; S.rs.climit = 36; render(); }
  if (id === 'pf-sort') { S.pf = {sort: e.target.value}; render(); }
  if (id === 'rs-sort') { S.rs.sort = e.target.value; S.rs.dir = -1; S.rs.climit = 36; render(); }
  if (id === 'cy-sort') { S.cy.sort = e.target.value; render(); }
  if (id === 'cy-csort') { S.cy.csort = e.target.value; render(); }
  if (id === 'th-sort') { S.th.sort = e.target.value; render(); }
  if (id === 'th-csort') { S.th.csort = e.target.value; render(); }
  if (id === 'pd-days') { S.pd.days = +e.target.value; render(); }
  if (id === 'pd-post') { S.pd.post = +e.target.value; render(); }
  if (id === 'nt-big') { S.near.big = e.target.value; S.near.limit = 30; render(); }
  if (id === 'if-big') { S.inf.big = e.target.value; S.inf.limit = 30; render(); }
  if (id === 'ask-scope') S.ask.scope = e.target.value;
  if (id === 'ask-big') S.ask.big = e.target.value;
  if (id === 'ask-depth') S.ask.depth = +e.target.value;
  if (id === 'c-sort') { S.calls.sort = e.target.value; S.calls.limit = 50; fillCalls(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#pop').hidden) { hideTip(); return; } if (!$('#findres').hidden) { $('#findres').hidden = true; return; } if (S.drawer) { closeCo(); return; } }
  if (e.target.id === 'find' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    const items = [...$('#findres').querySelectorAll('button')]; if (!items.length) return;
    if (e.key === 'Enter') { e.preventDefault(); items[findSel]?.click(); return; }
    e.preventDefault(); findSel = (findSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; renderFind(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.trk .r.sec')) { e.preventDefault(); e.target.click(); }
  if (e.target.id === 'ask-q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askRun(ASK.sample === null ? 'keyword' : 'ai'); return; }
  if (e.key === '/' && !e.target.closest('input,select,textarea')) { e.preventDefault(); $('#find').focus(); }
  if (e.key === 'Tab' && S.drawer) { const f = [...$('.drawer').querySelectorAll('button,a,input,select,[tabindex="0"]')].filter(x => x.offsetParent);
    if (!f.length) return; if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); } }
});
$('#find').addEventListener('focus', renderFind);
/* light / dark / auto: saved per browser, applied before first paint by the script at the top */
function applyTheme(m) { const r = document.documentElement; if (m === 'light' || m === 'dark') r.setAttribute('data-theme', m); else r.removeAttribute('data-theme');
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === m)); }
applyTheme(store.get('theme', 'auto'));
$('#themesel').addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (!b) return; e.stopPropagation(); store.set('theme', b.dataset.themeSet); applyTheme(b.dataset.themeSet); });

/* ---------- boot ---------- */
(async function boot() {
  renderNav();
  let ok = false;
  try { const r = await fetch('data/in.json', {cache: 'no-store'}); if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.companies)) { D = j; ok = true; } } } catch (e) {}
  if (!ok) { $('#view').innerHTML = '<div class="empty">The latest results could not be loaded. Reload the page to try again.</div>'; return; }
  D.companies.forEach(c => { byId[c.id] = c; });
  const h = location.hash.slice(1);
  S.view = RENDER[h] ? h : (RENDER[store.get('view', 'home')] ? store.get('view', 'home') : 'home');
  S.rs.view = store.get('rs-view', 'cards') === 'table' ? 'table' : 'cards';
  render();
  if (h.startsWith('co-') && byId[h.slice(3)]) openCo(h.slice(3));
  loadSums().then(() => renderNav());  /* near-term count uses lines from the summaries */
  loadRes().then(() => { renderNav(); if (['rescal', 'results', 'home', 'watch', 'upcoming', 'portfolio', 'pead', 'themes', 'turns', 'hidden'].includes(S.view)) render(); });
})();
</script>
