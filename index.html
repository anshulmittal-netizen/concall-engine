<title>Concall Signal Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: research floor. A light, airy desk: left rail of views, a sticky quarter bar, and each view opens on a
   board of live widgets (rings, gauges, histograms, heat tiles) before the detailed lists. Warm paper and plum ink, with a
   rose-to-saffron glow for the headline moments; rose marks what you can act on. The five verdict colours run from
   chilli red through saffron and warm grey to leaf green and deep jade, and are used for scores only. */
:root{
  --bg:#FFF9F3; --rail:#FFF1E4; --panel:#FFFFFF; --panel2:#FFF6EC; --line:#F2E3D2; --line2:#E6CDB0;
  --fg:#1C1015; --muted:#5A464C; --faint:#8C787D;
  --accent:#D0215F; --accentsoft:rgba(208,33,95,.09); --onAccent:#FFFFFF; --saffron:#FF9F1C; --saffronsoft:rgba(255,159,28,.20);
  --v5:#0B8466; --v4:#3FA52F; --v3:#968A82; --v2:#F29A12; --v1:#E0352B;
  --up:#2E8F2A; --down:#D1302A; --warn:#B86A00;
  --teal:#0A8478; --violet:#7A3CC4; --rose:#D0215F; --sand:#A35A35;
  --gold:var(--accent); --goldsoft:var(--accentsoft); --blue:var(--accent); --onGold:var(--onAccent);
  --shadow:0 1px 2px rgba(80,36,20,.05),0 10px 30px rgba(120,56,24,.08); --shadow2:0 20px 54px rgba(100,40,20,.18); --scrim:rgba(43,24,32,.34);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --r:18px; --r2:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1D1519; --rail:#211820; --panel:#2A1F26; --panel2:#33262E; --line:#45343E; --line2:#5A4550;
  --fg:#FFF6EF; --muted:#DCC8C2; --faint:#A8939A;
  --accent:#FF8AB4; --accentsoft:rgba(255,138,180,.15); --onAccent:#2A0E19; --saffron:#FFB547; --saffronsoft:rgba(255,181,71,.16);
  --v5:#34C29F; --v4:#8FCB4F; --v3:#8F837D; --v2:#E6A93A; --v1:#FF6A57;
  --up:#8FCB4F; --down:#FF6A57; --warn:#FFBE5C;
  --teal:#5AD6C6; --violet:#D3A8F5; --rose:#FF8AB4; --sand:#F0C2A8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow2:0 20px 54px rgba(0,0,0,.55); --scrim:rgba(10,4,8,.62);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1D1519; --rail:#211820; --panel:#2A1F26; --panel2:#33262E; --line:#45343E; --line2:#5A4550;
  --fg:#FFF6EF; --muted:#DCC8C2; --faint:#A8939A;
  --accent:#FF8AB4; --accentsoft:rgba(255,138,180,.15); --onAccent:#2A0E19; --saffron:#FFB547; --saffronsoft:rgba(255,181,71,.16);
  --v5:#34C29F; --v4:#8FCB4F; --v3:#8F837D; --v2:#E6A93A; --v1:#FF6A57;
  --up:#8FCB4F; --down:#FF6A57; --warn:#FFBE5C;
  --teal:#5AD6C6; --violet:#D3A8F5; --rose:#FF8AB4; --sand:#F0C2A8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); --shadow2:0 20px 54px rgba(0,0,0,.55); --scrim:rgba(10,4,8,.62);
  color-scheme:dark; }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 520px at 90% -12%,var(--saffronsoft),transparent 55%) fixed,var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--body);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* ---------- shell ---------- */
.app{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:244px minmax(0,1fr);gap:36px;align-items:start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-block:26px;display:flex;flex-direction:column;gap:26px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:36px;height:36px;flex:none;position:relative}
.mark i{position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;animation:spin 7s linear infinite}
.mark b{position:absolute;inset:11px;border-radius:50%;background:var(--saffron);animation:breathe 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.72);opacity:.75}}
.brand h1{font-size:19px;font-weight:700;line-height:1.1}
.brand p{font-size:12.5px;color:var(--muted)}
.nav{display:grid;gap:20px}
.nav-group{display:grid;gap:3px}
.nav-group>.eyebrow{padding:0 12px 6px;font-size:10.5px;color:var(--faint)}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:11px;padding:9px 12px;color:var(--muted);font-weight:600;font-size:14.5px;transition:background .2s,color .2s,transform .2s var(--ease)}
.nav button:hover{background:var(--panel);color:var(--fg);transform:translateX(2px)}
.nav button[aria-current="page"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.nav button[aria-current="page"]>span:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--accent));margin-right:9px;vertical-align:1px}
.nav .ct{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);background:var(--rail);border-radius:99px;padding:1px 8px;white-space:nowrap}
.nav button[aria-current="page"] .ct{background:var(--accentsoft);color:var(--accent)}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--muted);display:grid;gap:6px;border-top:1px solid var(--line);padding-top:16px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--fg);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 var(--up);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.main{min-width:0;display:grid;gap:28px}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap;padding-block:16px}
.qwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:100%;flex-wrap:wrap;padding:3px;gap:2px;box-shadow:var(--shadow)}
.seg button{background:none;border:0;border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;transition:background .2s,color .2s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.seg .num{font-size:11.5px;opacity:.7;font-weight:500}
.prog-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;animation:breathe 2s ease-in-out infinite}
.find{position:relative;flex:1 1 260px;max-width:440px;margin-left:auto}
.find input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 38px;font-size:14.5px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.find input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accentsoft)}
.find svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.find-res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:6px;display:grid;gap:2px;z-index:25;max-height:60vh;overflow:auto;animation:enter .2s var(--ease) both}
.find-res button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;background:none;border:0;border-radius:10px;padding:9px 11px}
.find-res button:hover,.find-res button.on{background:var(--panel2)}
.find-res b{font-family:var(--display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find-res span{font-size:12.5px;color:var(--muted)}

/* ---------- view frame ---------- */
.view{display:grid;gap:26px;min-width:0;animation:enter .4s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}}
.view>*{animation:rise .55s var(--ease) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{transform:translateY(14px);opacity:.001}}
.vhead{display:grid;gap:10px}
.vhead .row{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.vhead h2{font-size:clamp(28px,3.4vw,38px);font-weight:700;line-height:1.08}
.vhead .purpose{color:var(--muted);max-width:68ch;font-size:16px}
.badge{font-size:12px;font-family:var(--mono);padding:3px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);max-width:920px}
details.how summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;color:var(--fg)}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .25s var(--ease);margin-right:4px}
details.how[open] summary::before{transform:rotate(45deg)}
details.how .body{padding:0 18px 16px 34px;display:grid;gap:8px;font-size:14.5px}
details.how ol,details.how ul{margin:0;padding-left:18px;display:grid;gap:6px}
details.how b{font-weight:700}

/* info tips + hover tooltip */
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font:600 10.5px/1 var(--mono);padding:0;vertical-align:1px;margin-left:5px;flex:none;transition:border-color .15s,color .15s}
.i:hover,.i[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
#pop{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:13px 15px;font-size:14px;display:grid;gap:6px;animation:enter .18s var(--ease) both}
#pop h4{font-size:15px}
#tt{position:fixed;z-index:70;pointer-events:none;background:var(--fg);color:var(--panel);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.4;max-width:260px;box-shadow:var(--shadow2);transition:opacity .12s;white-space:pre-line}
#tt b{font-family:var(--mono)}

/* ---------- shared bits ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:16px}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:600;transition:border-color .15s,background .15s,transform .15s var(--ease);white-space:nowrap;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--onAccent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:14px;font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:14px;max-width:100%;color:var(--fg)}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--muted);transition:all .18s var(--ease)}
.chip:hover{border-color:var(--line2);color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accentsoft)}
.count-line{font-size:13px;color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:var(--r)}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px;letter-spacing:.03em;padding:3px 10px;border-radius:99px;white-space:nowrap;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent)}
.v-strong{--pc:var(--v5)}.v-good{--pc:var(--v4)}.v-avg{--pc:var(--muted)}.v-weak{--pc:var(--warn)}.v-poor{--pc:var(--v1)}.v-flag{--pc:var(--v1)}
.st-turning{--pc:var(--v5)}.st-emerging{--pc:var(--accent)}.st-confirming{--pc:var(--up)}.st-crowded{--pc:var(--warn)}.st-deteriorating{--pc:var(--down)}.st-neutral{--pc:var(--muted)}
.delta{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)}.delta.dn{color:var(--down)}.delta.zero{color:var(--faint);font-weight:400}
.g-up{color:var(--up)}.g-dn{color:var(--down)}.g-flat{color:var(--muted)}
.sbar{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;flex:1;min-width:40px;box-shadow:inset 0 0 0 1px var(--line)}
.sbar i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.scorecell{display:flex;align-items:center;gap:9px}
.scorecell b{font-family:var(--mono);font-size:15.5px;min-width:24px}

/* list rows (tables that fold into cards on phones) */
.rows{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.r{display:grid;gap:4px 16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;transition:background .18s}
.r:first-child{border-top:0}
button.r{position:relative}
button.r:hover{background:var(--panel2)}
button.r::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);transform:scaleY(0);transition:transform .2s var(--ease)}
button.r:hover::after{transform:scaleY(1)}
.r.hd{background:var(--panel2);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:11px}
.r .nm{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25}
.r .sub{font-size:13px;color:var(--muted)}
.r .why{font-size:13.5px;color:var(--muted);line-height:1.45}
.calls .r{grid-template-columns:34px minmax(0,1.3fr) 170px 84px minmax(0,1fr) minmax(0,1.8fr) 104px 72px}
.r .rk{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.more{display:flex;justify-content:center;gap:12px;align-items:center;padding:8px}

/* ---------- widgets ---------- */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.w{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);display:grid;gap:14px;align-content:start;min-width:0;transition:transform .25s var(--ease),box-shadow .25s}
.w:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.w.span3{grid-column:span 3}.w.span4{grid-column:span 4}.w.span5{grid-column:span 5}.w.span6{grid-column:span 6}.w.span7{grid-column:span 7}.w.span8{grid-column:span 8}.w.span12{grid-column:span 12}
.w-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.w-head h3{font-size:17px;font-weight:600}
.w-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kpi{display:grid;gap:6px;align-content:start}
.kpi .v{font-family:var(--display);font-size:clamp(34px,3.6vw,46px);font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi svg{width:100%;height:42px;display:block}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1.3s var(--ease)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ctr b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.ring .ctr span{font-size:11px;color:var(--muted)}
.ring .ctr b span{font-size:inherit}
[hidden]{display:none!important}
.legend{display:grid;gap:7px;font-size:13px;min-width:0}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .num{color:var(--muted)}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--mono);fill:var(--muted);font-weight:500}
.chart .bar{transform-origin:bottom;transform-box:fill-box;animation:growY .9s var(--ease) both}
@keyframes growY{from{transform:scaleY(0)}}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart .bar:hover{filter:brightness(1.12)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{position:relative;text-align:left;border:0;border-radius:13px;padding:12px 13px 11px;background:color-mix(in srgb,var(--tc) var(--tp,20%),var(--panel));color:var(--fg);display:grid;gap:3px;min-height:86px;align-content:space-between;transition:transform .2s var(--ease),box-shadow .2s;animation:pop .5s var(--ease) both;overflow:hidden}
.tile:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow2);z-index:1}
.tile b{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2}
.tile .tv{font-family:var(--mono);font-size:20px;font-weight:600}
.tile .ts{font-size:11.5px;color:var(--muted)}
@keyframes pop{from{transform:scale(.92);opacity:.001}}
.gauge-w{display:grid;justify-items:center;gap:6px}
.gauge-w svg{width:100%;max-width:260px;height:auto;display:block}
.gauge-w .needle{transform-origin:130px 130px;transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
.gauge-w .gv{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;margin-top:-30px}
.movers{display:grid;gap:8px}
.mv{display:grid;grid-template-columns:minmax(0,1fr) 110px 50px;gap:10px;align-items:center;font-size:13.5px;background:none;border:0;text-align:left;padding:5px 6px;border-radius:9px;transition:background .15s}
.mv:hover{background:var(--panel2)}
.mv b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .tr{height:8px;border-radius:5px;background:var(--panel2);position:relative;overflow:hidden}
.mv .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:5px;transform-origin:left;animation:grow .9s var(--ease) both}
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker-in{display:flex;gap:10px;width:max-content;padding:10px;animation:tick 80s linear infinite}
.ticker:hover .ticker-in{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk{display:inline-flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.tk:hover{border-color:var(--accent)}
.tk b{font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.radar svg{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.radar .shape{transform-origin:150px 150px;animation:pop .9s var(--ease) both}
.spark-up{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.today{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 30px;display:grid;gap:18px;box-shadow:var(--shadow)}
.today::before{content:"";position:absolute;inset:-45% -12% auto auto;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,var(--saffronsoft),var(--accentsoft) 45%,transparent 70%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(-60px,40px) scale(1.15)}}
.today>*{position:relative}
.today h3{font-size:clamp(22px,2.4vw,30px);font-weight:600;line-height:1.22;max-width:34ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.stat{display:grid;gap:3px}
.stat b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05}
.stat span{font-size:12.5px;color:var(--muted)}
.prog{height:10px;border-radius:9px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--accent));border-radius:9px;transform-origin:left;animation:grow 1.4s var(--ease) both}
.steps{display:grid;gap:12px;counter-reset:s;margin:0;padding:0}
.steps li{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accentsoft);font:600 12px var(--mono);color:var(--accent)}
.steps b{font-weight:600}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.pick{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px;align-content:start;box-shadow:var(--shadow);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.pick:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow2)}
.pick strong{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.2}
.pick .small{color:var(--muted)}
.pick .go{font-size:13px;color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mini-list .r{grid-template-columns:minmax(0,1fr) auto;padding-block:11px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.list-head h3{font-size:19px;font-weight:600}
.welcome{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(100deg,var(--saffronsoft),var(--accentsoft));border-radius:var(--r2);padding:14px 18px;font-size:14.5px}

/* ---------- tracker ---------- */
.cov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:center}
.cov .big{font-family:var(--display);font-size:34px;font-weight:700}
.trk .r{grid-template-columns:minmax(0,1.4fr) 160px 92px 86px 116px minmax(0,1fr) 120px}
.trk .r.sec{cursor:pointer}
.trk .r.sec:hover{background:var(--panel2)}
.trk .r.subr{background:color-mix(in srgb,var(--panel2) 70%,transparent)}
.trk .r.subr .nm{font-size:14.5px;padding-left:20px}
.caret{display:inline-block;width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:9px;transition:transform .25s var(--ease);vertical-align:2px}
.open>div>.nm .caret,.r.open .caret{transform:rotate(90deg)}
.c-m{display:none}
.covcell{display:flex;align-items:center;gap:8px}
.covcell .num{font-size:12.5px;white-space:nowrap}
.gidx{font-family:var(--mono);font-weight:600}
.cos{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px 20px;grid-column:1/-1}
.cos button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:12.5px}
.cos button:hover{border-color:var(--accent)}
svg text{font-family:var(--mono)}

/* ---------- guidance ---------- */
.gcard{display:grid;gap:12px;align-content:start}
.gcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gcard h4{font-size:18px;font-weight:600}
.gauge{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--v1),var(--v3) 50%,var(--v5))}
.gauge i{position:absolute;top:-6px;width:6px;height:22px;border-radius:3px;background:var(--fg);transform:translateX(-3px);box-shadow:0 0 0 3px var(--panel);animation:slideIn 1.1s var(--ease) both}
@keyframes slideIn{from{left:50%}}
.gauge-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-family:var(--mono)}
.quote-line{font-size:14px;border-left:3px solid var(--accent);padding-left:12px}

/* ---------- turns + themes ---------- */
.turn{display:grid;gap:12px;align-content:start}
.turn.hit{border-color:var(--v5);box-shadow:0 0 0 3px color-mix(in srgb,var(--v5) 18%,transparent),var(--shadow)}
.turn .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.turn h4{font-size:18px;font-weight:600}
.brow{display:grid;grid-template-columns:124px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.brow .sbar{height:9px}
.brow .num{text-align:right;font-size:12.5px}
.turn>*,.sig ol,.sig li{min-width:0}
.sig{border-radius:9px;min-width:0}
.sig>summary{list-style:none;cursor:pointer;padding:4px 5px;margin:0 -5px;border-radius:9px;grid-template-columns:140px minmax(0,1fr) 44px}
.sig>summary::-webkit-details-marker{display:none}
.sig>summary:hover{background:var(--panel2)}
.sig>summary .lab::before{content:"\25B8";display:inline-block;width:12px;color:var(--faint);transition:transform .2s}
.sig[open]>summary .lab::before{transform:rotate(90deg)}
.sig ol{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:5px}
.sig-co{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.sig-co:hover{border-color:var(--accent)}
.sig-co .r1{display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-size:13.5px}
.sig-co .r1 b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig-co .ev{font-size:12.5px;color:var(--muted);line-height:1.4}
.sig-co .ev em{font-style:normal;color:var(--fg);opacity:.85}
.sig .more{font-size:12px;color:var(--faint);margin:2px 0 0}
.sig.top5{border-top:1px solid var(--line);padding-top:8px}
.th .r{grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) 80px 110px}
.thbar{display:flex;align-items:center;gap:8px}

/* ---------- ideas + first ---------- */
.idea{display:grid;gap:10px;align-content:start;transition:transform .25s var(--ease),box-shadow .25s}
.idea:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.idea.red{border-color:color-mix(in srgb,var(--down) 40%,var(--line))}
.idea .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.idea h4{font-size:19px;font-weight:600}
.idea p{font-size:14px;color:var(--muted)}
.idea .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-decoration:none}
.first .r{grid-template-columns:minmax(0,1.3fr) 100px 110px 70px minmax(0,1fr) minmax(0,2fr)}
.up-day{display:grid;gap:10px}
.up-day h3{font-size:17px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.up-day h3 .num{font-size:12.5px;color:var(--muted);font-weight:400}
.up .r{grid-template-columns:80px minmax(0,1.6fr) minmax(0,1fr) 110px 200px}
.up .r .tm{white-space:nowrap;font-family:var(--mono);font-size:13.5px}
.up .r .lastsc{font-family:var(--mono);font-size:13px}
.up-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.rc .r{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 110px 170px 200px}
.res-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
table.res{border-collapse:collapse;width:100%;min-width:1080px;font-size:13.5px}
table.res th{position:sticky;top:0;background:var(--panel2);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
table.res th button[aria-sort]{color:var(--accent)}
table.res td{padding:11px 12px;border-top:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
table.res tbody tr{transition:background .15s}
table.res tbody tr:hover{background:var(--panel2)}
table.res td .v{font-family:var(--mono);font-size:13.5px;display:block}
table.res td .g{font-family:var(--mono);font-size:11.5px;display:block}
table.res td.co{white-space:normal;min-width:210px}
table.res td.co .nm{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.25}
.gp{color:var(--up)}.gn{color:var(--down)}.g0{color:var(--faint)}
.basis{font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line);border-radius:5px;color:var(--muted);margin-left:4px;vertical-align:1px}
.nextcall{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.wstar{color:var(--warn);font-size:.95em}
.r.wrow{box-shadow:inset 3px 0 0 var(--warn);background:color-mix(in srgb,var(--warn) 5%,transparent)}
table.res tr.wrow td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.wl .r{grid-template-columns:minmax(0,1.5fr) 150px 170px 110px 210px}
.wl-when{font-family:var(--mono);font-size:13px;font-weight:600}
.wl-when.soon{color:var(--warn)}
.wl-names{display:flex;flex-wrap:wrap;gap:6px}
.wl-names span,.wl-names button{font-size:13px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.wl-banner{display:flex;gap:12px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--panel));border-radius:var(--r);padding:14px 18px}
@media (max-width:760px){.wl .r{grid-template-columns:minmax(0,1fr) auto}.wl .r>:nth-child(2),.wl .r>:nth-child(3){display:none}.wl .r .up-actions{grid-column:1/-1;justify-content:flex-start}}
.ask-p{font-size:13.5px;line-height:1.5;border-left:2px solid var(--line2);padding-left:11px}
.ask-p mark.hl{--tc:var(--accent)}
.mg .r{grid-template-columns:minmax(0,240px) minmax(0,1fr) 190px;align-items:start}
.mg .r>:last-child{justify-content:flex-end}
.mg-ch{font-size:14px}
@media (max-width:760px){.mg .r{grid-template-columns:minmax(0,1fr)}}
.nt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:16px}
.nt{display:grid;gap:11px;align-content:start;transition:transform .25s var(--ease),box-shadow .25s}
.nt:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.nt.top3{border-color:var(--v5);box-shadow:0 0 0 3px color-mix(in srgb,var(--v5) 15%,transparent),var(--shadow)}
.nt .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nt h4{font-size:19px;font-weight:600;line-height:1.2}
.nt .ntsc{display:grid;justify-items:end;gap:4px;flex:none}
.nt .ntsc b{font-family:var(--display);font-size:30px;line-height:1}
.nt .why-chips{display:flex;flex-wrap:wrap;gap:6px}
.nt .why-chips span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.nt .why-chips span.hot{border-color:color-mix(in srgb,var(--up) 45%,var(--line));color:var(--fg);background:color-mix(in srgb,var(--up) 8%,var(--panel))}
.nt ul{margin:0;padding-left:17px;display:grid;gap:6px;font-size:13.5px;line-height:1.5}
.nt .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.nt-tier{--pc:var(--up)}.nt-tier.t1{--pc:var(--v5)}.nt-tier.t3{--pc:var(--accent)}

/* ---------- help ---------- */
.help{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
.help article{display:grid;gap:30px;max-width:76ch}
.help section{display:grid;gap:12px}
.help h3{font-size:23px;font-weight:600}
.help p,.help li{font-size:15.5px}
.help ul,.help ol{margin:0;padding-left:20px;display:grid;gap:7px}
.toc{position:sticky;top:96px;display:grid;gap:4px;font-size:14px}
.toc a{color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:9px}
.toc a:hover{background:var(--panel);color:var(--fg)}
.vguide{display:grid;gap:8px}
.vguide div{display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.vguide div b{font-family:var(--display);font-weight:600}
.weights{display:grid;gap:9px}
.weights .w{display:grid;grid-template-columns:200px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;background:none;border:0;box-shadow:none;padding:0;border-radius:0}
.weights .w:hover{transform:none;box-shadow:none}
.weights .sbar{height:11px}
.weights .sbar i{background:var(--accent)}
dl.gl{margin:0;display:grid;gap:0}
dl.gl div{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;padding:11px 0;border-top:1px solid var(--line)}
dl.gl dt{font-family:var(--display);font-weight:600}
dl.gl dd{margin:0}
.bands{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- company panel ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(820px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow2);
  display:flex;flex-direction:column;animation:slide .4s var(--ease) both;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(60px);opacity:.001}}
.dr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.dr-body{overflow-y:auto;padding:24px 26px 48px;display:grid;gap:22px;align-content:start;overscroll-behavior:contain}
.dr-body>*{animation:rise .5s var(--ease) both}
.dr-body>*:nth-child(2){animation-delay:.05s}.dr-body>*:nth-child(3){animation-delay:.1s}.dr-body>*:nth-child(n+4){animation-delay:.15s}
.dr-head h2{font-size:clamp(26px,3.4vw,34px);font-weight:700;line-height:1.08;margin-top:4px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow)}
.bigscore{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.vfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 18px}
.vfacts div{display:grid;gap:2px}
.vfacts span{font-size:12px;color:var(--muted)}
.vfacts b{font-size:15px}
.oneline{padding:16px 18px;border-radius:var(--r2);background:linear-gradient(120deg,var(--saffronsoft),var(--accentsoft))}
.oneline p{font-family:var(--display);font-weight:500;font-size:18.5px;line-height:1.38;margin-top:4px}
.dtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.dtabs button{background:none;border:0;padding:10px 14px 12px;font-weight:600;font-size:15px;color:var(--muted);position:relative;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--fg)}
.dtabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent);animation:grow .35s var(--ease) both}
.sec{display:grid;gap:12px}
.sec>h3{font-size:17px;font-weight:600;display:flex;align-items:center}
.fin{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fin div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.fin b{font-family:var(--mono);font-size:15px}
.fin span{font-size:12px;color:var(--muted)}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.scard h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-family:var(--body);font-weight:600}
.scard ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.qa{display:grid;gap:8px}
.qa details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
.qa summary{cursor:pointer;font-weight:600}
.qa p{margin-top:8px;opacity:.92}
.quotes blockquote{margin:0 0 10px;padding-left:14px;border-left:3px solid var(--accent);font-size:15px}
.trig{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px}
.trig .stripe{border-radius:4px;background:var(--tc)}
.trig strong{font-family:var(--display);font-weight:600;font-size:15.5px}
.trig blockquote{margin:5px 0 0;font-size:14.5px;opacity:.9}
.trig blockquote::before{content:"\201C"}.trig blockquote::after{content:"\201D"}
.mini{font-size:11.5px;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc);white-space:nowrap;margin-right:6px;font-weight:600}
mark.hl{color:inherit;background:color-mix(in srgb,var(--tc) 24%,transparent);border-radius:3px;padding:0 2px}
.t-supply{--tc:var(--v5)}.t-util{--tc:var(--accent)}.t-pricing{--tc:var(--teal)}.t-structure{--tc:var(--violet)}.t-inventory{--tc:var(--sand)}.t-demand{--tc:var(--muted)}.t-guidance{--tc:var(--up)}.t-novelty{--tc:var(--rose)}.t-tone{--tc:var(--down)}.t-growth{--tc:var(--violet)}

<script>
const ART_URL = 'https://claude.ai/artifact/Y3XcRY258aCXgadeZKZbh3';

/* ---------- vocabulary ---------- */
const TYPES = {supply:'Supply',util:'Utilisation',pricing:'Pricing',structure:'Industry structure',inventory:'Inventory',demand:'Demand',guidance:'Guidance',novelty:'Something new',tone:'Tone'};
const BLOCKS = [['supply','Supply discipline'],['pricing','Pricing & utilisation'],['structure','Industry structure'],['inventory','Inventory'],['demand','Demand'],['guidance','Guidance'],['novelty','Something new'],['tone','Tone & candour']];
const MODELS = {
  'Capital cycle':'Returns turn when supply growth stops, before demand recovers.',
  'Supply discipline':'Peers deferring capacity keeps pricing intact.',
  'Supply exit':'Capacity leaving the market tightens it for the survivors.',
  'Competitive capex':'Everyone expanding at once usually ends in overcapacity.',
  'Capacity bottleneck':'When capacity is the constraint, price does the adjusting.',
  'Consolidation':'Fewer competitors improve pricing for those that remain.',
  'Operating leverage':'Fixed costs spread over rising volume lift margins faster than sales.',
  'Pricing power':'Price rises stick without losing volume.',
  'Mix shift':'A rising share of higher-margin products lifts blended margins.',
  'Backlog conversion':'Orders already won turn into revenue over the next quarters.',
  'Hidden supplier':'Named in other companies’ calls before the market notices.',
  'China+1':'Customers diversifying away from China move orders to new suppliers.',
  'Customer stickiness':'Validated suppliers are hard to replace in regulated chains.',
  'Import substitution':'Domestic supply replacing imports under policy or cost advantage.',
  'Regulatory moat':'Licences, approvals or standards that keep new entrants out.',
  'Working-capital stress':'Cash stuck in receivables or inventory signals weak bargaining power.',
  'Deleveraging':'Debt paydown shifts value from lenders to equity holders.',
  'Capital allocation shift':'Buybacks, dividends or exits from low-return segments.',
  'Management change':'New leadership resetting strategy, targets or culture.'
};
const IDEA_TYPES = {
  'Divergence':'Scores well above the median call in its own sub-sector. The company is doing something its peers are not.',
  'First mover':'Among the first companies to talk about a theme that is now spreading.',
  'Hidden supplier':'Named as a supplier or partner in at least two other companies’ calls.',
  'Credibility upgrade':'Raised guidance, and management has a record of delivering what it guides.',
  'Red flag':'Something in the call that needs checking before anyone owns or buys the stock.'
};
const GL = {
  score:['Concall Signal Score','0 to 100. How strongly the call points to a growing, improving business. Weighted: guidance-backed growth & capacity 45 (growth or turnaround guided, counted in full only when backed by capacity, orders or a clear plan and a management that delivers; plus capacity going live in 2–3 quarters), industry supply discipline 20, results delivered this quarter 15, pricing & utilisation 10, demand 5, new developments & themes 3, tone 2. The Score breakdown tab in each company panel shows the exact working.'],
  verdict:['Verdict','A plain label for the score. Strong 70+, Good 60–69, Average 50–59, Weak 40–49, Poor below 40. Red flag means a veto capped the score at 40.'],
  change:['vs last call','Points gained or lost against the company’s previous call. A dash means this is the first call we have read for the company, so there is nothing to compare yet.'],
  pct:['Rank in quarter','Where the call ranks among all calls read for the same quarter. “Top 10%” means only a tenth of the quarter’s calls scored higher.'],
  cred:['Management credibility','0 to 100: how often past guidance was delivered in later calls. “Untested” means there is no earlier guidance to check yet. With an untested management, guidance counts only 85% of its distance from neutral, so new names do not jump the queue on promises alone.'],
  veto:['Veto','A serious negative (guidance withdrawn without reason, auditor or governance issue, regulatory action) caps the score at 40, however good the rest of the call was.'],
  guidance:['Guidance','What management said about the future in this call. Raised: targets lifted or new positive targets given. Cut: targets lowered or withdrawn. Steady: reiterated or no change.'],
  gidx:['Guidance index','0 to 100 for a group of companies. 50 is neutral. Above 60: more companies raised than cut. Below 40: cuts dominate. Companies whose management has delivered before count for more.'],
  coverage:['Reported','Companies that have held and filed their call this quarter, out of all listed companies in that sector.'],
  new:['New','Calls filed in the last day / the last 7 days. The engine reads new filings every night.'],
  avg:['Average score','Mean Concall Signal Score of the calls read in the group this quarter.'],
  breadth:['Breadth','Share of companies in the sub-sector whose call shows the signal. 60% supply discipline means 6 in 10 companies talked about holding back capacity.'],
  stage:['Stage','Turning: supply discipline high and pricing or utilisation now rising while demand talk is still lukewarm. Emerging: a signal rising fast from a low base. Confirming: pricing and demand both strong. Crowded: everyone talks about it. Deteriorating: pricing and demand falling. Baseline: only one quarter read so far, so no trend yet.'],
  themeCount:['Companies discussing','Distinct companies that discussed the theme with substance in their call, not just a passing mention.'],
  rescal:['Results calendar','The board meeting dates companies have announced to BSE for approving their quarterly results, from BSE’s forthcoming-results list. Results are usually filed the same evening.'],
  posted:['Results posted','Numbers from the official XBRL results filing on BSE: consolidated (C) when the company files them, otherwise standalone (S). Growth compares the same basis: YoY with the same quarter last year, QoQ with the previous quarter. PAT is profit attributable to shareholders (after minority interest). Growth is left blank when the earlier figure was a loss or close to zero.'],
  opprofit:['Operating profit','EBITDA for companies (profit before exceptional items and tax, plus finance costs and depreciation, less other income). For banks, pre-provision operating profit (PPOP) and net interest income (NII) in place of revenue. For other lenders and insurers, profit before tax, since interest is their main cost.'],
  upcoming:['Coming up','Earnings calls companies have announced on BSE, read from the call intimation each company must file before the call. Dates and times are read from the filing automatically, so open the intimation to confirm before dialling in. Reschedules replace the original date.'],
  first:['First-time callers','Confirmed: the transcript says it is the first or maiden call. Likely: BSE shows no earnings call transcript or analyst / investor meet filing for the company from 2019 until this call.'],
  namedBy:['Named in other calls','Companies whose own transcript names this company, with how they described it: customer, supplier, peer or partner. Only exact full-name matches count.'],
  triggers:['Triggers','Specific statements from the call that could move the thesis. Each comes with the quote it was drawn from, checked word for word against the transcript.'],
  schema:['Signal read','Eight readings of the call, each scored −2 (clearly negative) to +2 (clearly positive). They feed the score.'],
  models:['Mental models','The investing patterns this call fits. A quick way to see what kind of story it is.'],
  archetype:['Archetype','The overall type of story the call tells, such as a cyclical bottoming, a supply-side squeeze or a red flag.'],
  nearterm:['Near-term strength','Companies scoring 60+ whose latest call shows at least three strong near-term signals (capacity going live within 3 quarters, growth guided 15%+, strong or raised guidance, strong demand, next quarter called out) or a Guidance-backed growth & capacity part of 0.75+. There is no separate score.'],
  quarter:['Quarter switch','Pick the results season you want to look at. Every call-based view follows it: Today, All calls, First-time callers, Sector tracker, Guidance, Sector turns, Themes, Ideas, Near-term strength and Inflection watch show only that quarter’s calls. A season still in progress is compared with the quarter before it. Near-term strength and Inflection watch list companies whose latest call is from that quarter. “All” shows each company’s latest call, and the sector boards use the latest full quarter. Coming up, the results pages and Management changes go by date, not quarter.']
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n ?? 0).toLocaleString('en-IN');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${+d} ${MON[+m - 1]} ${y}`; };
const sdate = s => { if (!s) return ''; const [, m, d] = s.slice(0, 10).split('-'); return `${+d} ${MON[+m - 1]}`; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tip = k => `<button class="i" data-tip="${k}" aria-label="What is ${esc(GL[k]?.[0] || k)}?">?</button>`;
const store = {get(k, d) { try { const v = localStorage.getItem('csd2-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('csd2-' + k, JSON.stringify(v)); } catch (e) {} }};
function verdict(score, veto) {

  return score >= 70 ? {w: 'Strong', c: 'v-strong'} : score >= 60 ? {w: 'Good', c: 'v-good'} : score >= 50 ? {w: 'Average', c: 'v-avg'} : score >= 40 ? {w: 'Weak', c: 'v-weak'} : {w: 'Poor', c: 'v-poor'};
}
const vcol = (s, veto) => veto ? 'var(--v1)' : s >= 70 ? 'var(--v5)' : s >= 60 ? 'var(--v4)' : s >= 50 ? 'var(--muted)' : s >= 40 ? 'var(--warn)' : 'var(--v1)';
const vpill = (s, veto) => { const v = verdict(s, veto); return `<span class="pill ${v.c}">${v.w}</span>`; };
const scoreCell = (s, veto, i = 0) => `<span class="scorecell"><b style="color:${vcol(s, veto)}">${s}</b><span class="sbar"><i style="width:${s}%;background:${vcol(s, veto)};animation-delay:${Math.min(i, 20) * .02}s"></i></span>${vpill(s, veto)}</span>`;
const dcell = d => d ? `<span class="delta ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : '<span class="delta zero">–</span>';
const gcell = g => g > 0 ? '<span class="g-up">▲ Raised</span>' : g < 0 ? '<span class="g-dn">▼ Cut</span>' : '<span class="g-flat">Steady</span>';
const gword = g => g == null ? '' : g >= 60 ? 'Raising' : g <= 40 ? 'Cutting' : 'Mixed';
const gcol = g => g == null ? 'var(--muted)' : g >= 60 ? 'var(--v5)' : g <= 40 ? 'var(--v1)' : 'var(--muted)';
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count;
    if (reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now(), step = t => { const p = Math.min(1, (t - t0) / 800); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); });
}

/* ---------- data + state ---------- */
let D = null;
const S = {view: 'home', q: '', calls: {search: '', big: '', sub: '', sort: 'best', chips: new Set(), limit: 50},
  first: {status: ''}, rc: {big: '', search: '', read: false, watch: false, days: 14}, rs: {big: '', search: '', days: 7, sort: 'filed', dir: -1, chips: new Set(), limit: 100}, up: {big: '', search: '', earn: true, read: false, watch: false, days: 14}, turns: {stage: ''}, ideas: {tab: 'ideas'}, near: {big: '', tier: '', chips: new Set(), limit: 30}, inf: {side: 'up', big: '', sharp: false, pending: false, limit: 30}, mg: {days: 30, top: true, inCalls: false}, ask: {q: '', scope: 'latest', big: '', depth: 40, busy: false, res: null, err: '', stage: '', tab: 'match', limit: 30, plan: null}, openSec: new Set(), drawer: null};
const byId = {};
const quarters = () => { const m = {}; (D.calls || []).forEach(c => { (m[c.period] = m[c.period] || {label: c.period, key: c.periodKey, n: 0}).n++; });
  return Object.values(m).sort((a, b) => b.key.localeCompare(a.key)); };
const curQ = () => S.q || D.season || 'all';
const inProg = q => (D.inProgress || []).some(x => x.season === q);
function callsQ() {
  const all = D.calls || [];
  if (curQ() !== 'all') return all.filter(c => c.period === curQ());
  const latest = {}; all.forEach(c => { if (!latest[c.id] || c.periodKey > latest[c.id].periodKey) latest[c.id] = c; });
  return Object.values(latest);
}
const trackerQ = () => { const t = D.trackers || {}; return t[curQ()] || t[D.season] || D.tracker || null; };
/* the quarter the sector, theme and idea boards are built for: the one picked above ("All" uses the latest full quarter) */
const boardQ = () => { const q = curQ(); return q !== 'all' && (D.sectorsBy || {})[q] ? q : D.season; };
const sectorsQ = () => (D.sectorsBy || {})[boardQ()] || D.sectors || [];
const themesQ = () => { const b = boardQ(), t = (D.themesBy || {})[b] || D.themes || []; return b === D.season ? t : t.filter(x => x.c.at(-1) > 0); };
const ideasQ = () => (D.ideasBy || {})[boardQ()] || D.ideas || [];
/* company reads (signals, triggers, growth) exist for each company's latest call; a quarter view keeps those from that quarter */
const inQ = c => curQ() === 'all' || c.period === curQ();
const callOf = (id, q) => (D.calls || []).find(x => x.id === id && x.period === q);
const callsFor = id => (D.calls || []).filter(x => x.id === id).sort((a, b) => b.periodKey.localeCompare(a.periodKey));
const lastDate = () => (D.calls || []).reduce((m, c) => c.date > m ? c.date : m, '');
/* upcoming calls (from BSE call intimations) */
const istToday = () => { try { return new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Kolkata'}).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const wday = iso => WD[new Date(iso + 'T00:00:00Z').getUTCDay()];

/* score distribution: 5-point bins, coloured by verdict band */
function histogram(scores, {h = 190} = {}) {

  const W = 640, x0 = 34, x1 = W - 6, y0 = 10, y1 = h - 26, max = Math.max(1, ...bins.map(b => b.n));

    ${[20, 40, 50, 60, 70, 100].map(s => `<text x="${X(s)}" y="${h - 8}" text-anchor="middle" font-size="12.5">${s}</text>`).join('')}

  </svg>`;
}

const SORTS = {best: ['Highest score', (a, b) => b.score - a.score], worst: ['Lowest score', (a, b) => a.score - b.score],

const SIZES = {large: ['Large cap · ₹50,000 Cr+', v => v >= 50000], mid: ['Mid cap · ₹10,000–50,000 Cr', v => v >= 10000 && v < 50000],
  small: ['Small cap · ₹2,000–10,000 Cr', v => v >= 2000 && v < 10000], micro: ['Micro cap · below ₹2,000 Cr', v => v != null && v < 2000]};
const sizeOk = (c, k) => !k || SIZES[k][1](c.mcapCr ?? byId[c.id]?.mcapCr);
const CHIPS = {raised: ['Guidance raised', c => c.g > 0], cut: ['Guidance cut', c => c.g < 0], flag: ['Red flags', c => c.veto], strong: ['Strong or Good (60+)', c => c.score >= 60 && !c.veto]};
function filteredCalls() {
  const f = S.calls, q = f.search.toLowerCase();

    return {...w, c, r, d, posted, co: byId[w.id], nc: nextCall(w.id)}; });
  const soon = all.filter(x => !x.posted && x.d != null && x.d >= 0 && x.d <= lead).sort((a, b) => a.d - b.d || a.name.localeCompare(b.name));
  const later = all.filter(x => !x.posted && x.d != null && x.d > lead).sort((a, b) => a.d - b.d || a.name.localeCompare(b.name));
  const late = all.filter(x => !x.posted && x.d != null && x.d < 0).sort((a, b) => a.d - b.d);
  const done = all.filter(x => x.posted).sort((a, b) => b.r.filed.localeCompare(a.r.filed));
  const none = all.filter(x => !x.posted && x.d == null).sort((a, b) => a.name.localeCompare(b.name));
  const last = x => x.co ? `<span style="color:${vcol(x.co.score, x.co.veto)}">${x.co.score}</span> <span class="small muted">${esc(x.co.period)}</span>` : '<span class="small muted">not read</span>';
  const acts = x => `<span class="up-actions">${x.co ? `<button class="btn" data-open="${esc(x.id)}">Last call</button>` : ''}<a class="btn" href="https://www.bseindia.com/stock-share-price/x/x/${esc(x.id)}/" target="_blank" rel="noopener">BSE ↗</a></span>`;
  const callTxt = x => x.nc ? esc(callWhen(x.nc)) : '<span class="muted">not announced</span>';
  const row = x => `<div class="r wrow"><span style="min-width:0"><span class="nm" style="display:block">${esc(x.name)}</span><span class="sub">${esc(x.c?.mcap || '')}${x.c?.mcap && x.c?.sector ? ' · ' : ''}${esc(x.c?.sector || '')}</span></span>
      <span><span class="wl-when ${x.d != null && x.d <= lead ? 'soon' : ''}">${x.d != null ? esc(whenTxt(x.d)) : '–'}</span><br><span class="small muted">${x.c ? esc(wday(x.c.date) + ' ' + fdate(x.c.date)) : ''}</span></span>
      <span class="small">Call: ${callTxt(x)}</span><span class="lastsc">${last(x)}</span>${acts(x)}</div>`;
  const prep = x => `<article class="card nt" style="border-color:var(--gold)">
      <div class="top"><div style="min-width:0"><span class="num small muted">${esc(x.c?.sector || '')}</span><h4>${esc(x.name)}</h4><span class="small muted">${esc(x.c?.mcap || '')}</span></div>
        <div class="ntsc"><span class="pill v-strong">${esc(whenTxt(x.d))}</span><span class="small muted">${esc(wday(x.c.date) + ' ' + fdate(x.c.date))}</span></div></div>
      <p class="small" style="margin:0"><b>Earnings call:</b> ${callTxt(x)}${x.nc?.url ? ` · <a href="${esc(x.nc.url)}" target="_blank" rel="noopener">intimation ↗</a>` : ''}</p>
      ${x.co ? `<p class="small" style="margin:0"><b>Last concall (${esc(x.co.period)}), score <span style="color:${vcol(x.co.score, x.co.veto)}">${x.co.score}</span>:</b> ${esc(x.co.thesis || '')}</p>` : '<p class="small muted" style="margin:0">No concall read for this company yet.</p>'}

  const resRow = x => { const r = x.r; return `<div class="r wrow"><span style="min-width:0"><span class="nm" style="display:block">${esc(x.name)}</span><span class="sub">${esc(r.label)} · filed ${esc(sdate(r.filed))} ${esc(r.filed.slice(11, 16))}</span></span>
      <span class="small">Revenue ${gTag(r.rev_yoy)}</span><span class="small">${esc(r.opLabel)} ${gTag(r.op_yoy)}</span><span class="small">PAT ${gTag(r.pat_yoy)}</span>
      <span class="up-actions">${x.co ? `<button class="btn" data-open="${esc(x.id)}">Last call</button>` : ''}<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Filing ↗</a></span></div>`; };
  const sec = (t, n, body) => `<section style="display:grid;gap:10px"><div class="list-head"><h3>${t}</h3><span class="small muted">${n}</span></div>${body}</section>`;
  return hd + `
    <div class="stats card"><div class="stat"><b>${soon.length}</b><span>Results in the next ${lead} days</span></div><div class="stat"><b>${later.length}</b><span>Dates announced, later</span></div>
      <div class="stat"><b>${done.length}</b><span>Results posted</span></div><div class="stat"><b>${none.length}</b><span>Date not announced yet</span></div></div>
    ${sec(`Prepare: results in the next ${lead} days`, soon.length ? `${soon.length} compan${soon.length === 1 ? 'y' : 'ies'}` : '', soon.length ? `<div class="nt-grid">${soon.map(prep).join('')}</div>` : '<div class="empty">No watchlist results in the next few days.</div>')}
    ${later.length ? sec('Dates announced, later', later.length, `<div class="rows wl">${later.map(row).join('')}</div>`) : ''}
    ${late.length ? sec('Board met, results not on BSE yet', late.length, `<div class="rows wl">${late.map(row).join('')}</div>`) : ''}
    ${done.length ? sec('Results posted this season', done.length, `<div class="rows wl">${done.map(resRow).join('')}</div>`) : ''}
    ${none.length ? sec('Date not announced yet', none.length, `<div class="wl-names">${none.map(x => x.co ? `<button data-open="${esc(x.id)}">${esc(x.name)}</button>` : `<span>${esc(x.name)}</span>`).join('')}</div>`) : ''}
    ${(W.notOnBse || []).length ? `<p class="small muted">Not on BSE’s active list (likely NSE only), so their dates cannot be tracked here: ${W.notOnBse.map(esc).join(', ')}.</p>` : ''}`;
}

/* Results calendar: board meeting dates announced for results */
const crF = v => v == null ? '–' : Math.abs(v) >= 100 ? fmt(Math.round(v)) : v.toLocaleString('en-IN', {maximumFractionDigits: 1});
const gTag = (v, lab = '') => v == null ? `<span class="g g0">${lab ? lab + ' ' : ''}–</span>` : `<span class="g ${v > 0 ? 'gp' : v < 0 ? 'gn' : 'g0'}">${lab ? lab + ' ' : ''}${v > 0 ? '+' : ''}${v.toFixed(Math.abs(v) >= 100 ? 0 : 1)}%</span>`;
function resLoading(name) { if (!RES.data) { loadRes().then(() => { if (S.view === name) render(); renderNav(); }); return '<div class="empty">Loading results…</div>'; } return ''; }
function vResCal() {

  const bigs = [...new Set(all.map(r => r.bigSector).filter(b => b && b !== 'Unclassified'))].sort();

    return `<div class="r${isW(r.id) ? ' wrow' : ''}"><span style="min-width:0"><span class="nm" style="display:block">${star(r.id)}${esc(r.name)}${posted.has(r.id) && r.date <= t0 ? ' <span class="pill v-good">Posted</span>' : ''}</span><span class="sub">${esc(r.mcap || '')}${r.mcap && r.sector ? ' · ' : ''}${esc(r.sector || '')}</span></span>
      <span class="sub" style="min-width:0">${esc(r.bigSector || '')}</span>
      <span class="lastsc">${co ? `<span style="color:${vcol(co.score, co.veto)}">${co.score}</span> <span class="small muted">${esc(co.period)}</span>` : '<span class="small muted">not read yet</span>'}</span>

  return head('Results calendar', 'When each company’s board meets to approve its quarterly results, day by day. Results are usually on BSE the same evening and appear under Results posted.', `
      <ul><li>Dates come from BSE’s forthcoming-results list ${tip('rescal')}, checked every 30 minutes through the day.</li>

      `<span class="badge">${RES.data?.checked ? 'BSE checked ' + esc(RES.data.checked.replace('T', ' ')) + ' UTC' : 'Not checked yet'}</span>`) + (wait || `
    <div class="toolbar">

      <select id="rc-big" aria-label="Sector"><option value="">All sectors</option>${bigs.map(b => `<option ${b === f.big ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>

    ${Object.keys(days).length ? Object.entries(days).map(([d, rs]) => `<section class="up-day"><h3>${d === t0 ? 'Today' : d === addDays(t0, 1) ? 'Tomorrow' : esc(wday(d))} · ${esc(fdate(d))} <span class="num">${rs.length} compan${rs.length === 1 ? 'y' : 'ies'}</span></h3>

      : `<div class="empty">${all.length ? 'No results dates match these filters.' : 'No results dates read yet. They appear after the next check.'}</div>`}`);
}

/* Results posted: summary table from the XBRL filings */

  mup: ['Margin up YoY', r => r.opm != null && r.opm_prev_yoy != null && r.opm > r.opm_prev_yoy], read: ['Companies we have read', r => !!byId[r.id]], watch: ['★ My watchlist', r => isW(r.id)]};

}

      <td><span class="v">${crF(r.op)}</span><span class="g g0">${esc(r.opLabel)}</span></td><td>${gTag(r.op_yoy)}${gTag(r.op_qoq, 'QoQ')}</td>

      <td><span class="v">${r.eps == null ? '–' : r.eps.toFixed(2)}</span>${r.eps_yoy == null ? '' : gTag(r.eps_yoy)}</td></tr>`; };
  return head('Results posted', 'Quarterly numbers as companies file them on BSE, with growth on last year and last quarter. Sort by any column to find the standout results.', `
      <ul><li>Figures are ₹ Cr from the official XBRL filing ${tip('posted')}. <b>C</b> is consolidated, <b>S</b> standalone.</li>
      <li><b>Op. profit</b> is EBITDA for companies, PPOP for banks and profit before tax for other lenders ${tip('opprofit')}. <b>Margin</b> is operating profit over revenue, with the change on last year in basis points.</li>
      <li>Click a column heading to sort, again to reverse. <b>Last call</b> opens what management said on its previous concall, to check results against guidance.</li>

/* Sector tracker */
function bars14(vals, days) {
  const w = 104, h = 26, max = Math.max(1, ...vals), bw = w / vals.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Calls per day, last 14 days: ${vals.join(', ')}">${vals.map((v, i) => { const bh = v ? Math.max(3, v / max * (h - 2)) : 1.5;
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${i === vals.length - 1 ? 'var(--gold)' : v ? 'var(--blue)' : 'var(--line)'}"><title>${esc(days?.[i] || '')}: ${v}</title></rect>`; }).join('')}</svg>`;
}
function dailyChart(t) {
  const days = t.days || [], secs = t.sectors || [], vals = days.map((_, i) => secs.reduce((n, s) => n + (s.daily?.[i] || 0), 0));
  if (!vals.length) return '';
  const W = 560, H = 150, x0 = 28, x1 = W - 6, y0 = 14, y1 = H - 24, max = Math.max(1, ...vals), step = Math.max(1, Math.ceil(max / 4));
  const top = step * Math.ceil(max / step), bw = (x1 - x0) / vals.length, Y = v => y1 - v / top * (y1 - y0);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calls filed per day over the last 14 days">
    ${ticks.map(v => `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${x0 - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join('')}
    ${vals.map((v, i) => `<rect x="${(x0 + i * bw + 3).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${(y1 - Y(v)).toFixed(1)}" rx="3" fill="${i === vals.length - 1 ? 'var(--gold)' : 'var(--blue)'}" opacity="${v ? 1 : .3}"><title>${esc(fdate(days[i]))}: ${v} calls</title></rect>${v ? `<text x="${(x0 + i * bw + bw / 2).toFixed(1)}" y="${(Y(v) - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--fg)">${v}</text>` : ''}`).join('')}
    <text x="${x0}" y="${H - 6}" font-size="10" fill="var(--muted)">${esc(sdate(days[0]))}</text>
    <text x="${x1}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${esc(sdate(days.at(-1)))}</text></svg>`;
}
function trkRow(r, kind, idx, days) {
  const cls = kind === 'sec' ? 'r sec' + (S.openSec.has(r.name) ? ' open' : '') : 'r subr';
  return `<div class="${cls}" ${kind === 'sec' ? `data-sec="${idx}" role="button" tabindex="0" aria-expanded="${S.openSec.has(r.name)}"` : `data-subrow="${idx}"`}>
    <div style="min-width:0"><span class="nm">${kind === 'sec' ? '<span class="caret"></span>' : ''}${esc(r.name)}</span></div>
    <span class="covcell"><span class="num">${r.calls} / ${r.universe}</span><span class="sbar"><i style="width:${r.coverage}%;background:var(--blue)"></i></span></span>

/* Near-term strength: companies whose latest call points to strong results over the next one to few quarters.
   Built in the page from the engine's readings of each company's latest call, plus forward-looking lines in its summary. */
const NT_H = /next quarter|coming quarters?|next (two|three|four|few|couple of) quarters|\bH2\b|second half|remaining quarters|rest of the (year|fiscal)|balance of the year|near[- ]term|coming months|festive|from (october|november|december|january)/i;
const NT_FWD = /expect|will\b|target|guid|likely|anticipat|should|plan|on track|visib/i;
const NT_NEXT = /next quarter|coming quarter\b|sequential|coming months|festive/i;
const qNum = p => +(String(p || '').match(/Q([1-4])/) || [])[1] || 0;
const fyNum = p => +(String(p || '').match(/FY\s?'?(\d{2})/i) || [])[1] || 0;
/* a later quarter than the call's own: Q3 in a Q1 FY27 call, or any quarter of a later fiscal year */
function laterQ(line, period) {
  const cq = qNum(period), cy = fyNum(period); let next = false, later = false;
  for (const m of line.matchAll(/\bQ([1-4])(?:\s?FY\s?'?(\d{2}))?/gi)) { const q = +m[1], y = m[2] ? +m[2] : cy;
    if (y > cy || (y === cy && q > cq)) { later = true; if ((y === cy && q === cq + 1) || (cq === 4 && y === cy + 1 && q === 1)) next = true; } }
  return {later, next};
}
const NT_POS = /grow|growth|improv|strong|healthy|higher|increase|ramp|pick ?up|accelerat|record|doubl|expand|better|recover|uptick|robust|tailwind|commission|start(s|ed)? (commercial|production|contributing)|full utili[sz]|order (book|inflow)|execution|margin expansion|outperform|surge|boost/i;
const NT_NEG = /declin|lower|weak|pressure|loss|slow|cut\b|delay|headwind|soft|muted|subdued|challeng|drag|down|risk|uncertain|no firm|lost|not (yet|expected)|deferr|stress|impact/i;
const NT_MODELS = {'Backlog conversion': [8, 'Order book converting'], 'Operating leverage': [6, 'Operating leverage'], 'Mix shift': [3, 'Better mix'], 'Pricing power': [3, 'Pricing power']};
function ntLines(c) {
  const s = SUMS.data?.[c.ntKey], out = [];
  const ok = (l, needFwd) => { const lq = laterQ(l, c.period);
    if (!(NT_H.test(l) || lq.later) || !NT_POS.test(l) || NT_NEG.test(l) || (needFwd && !NT_FWD.test(l))) return;
    out.push({l, next: NT_NEXT.test(l) || lq.next}); };
  if (s) { (s.guidance_outlook || []).forEach(l => ok(l, false)); ['demand_pricing', 'capex_capacity'].forEach(f => (s[f] || []).forEach(l => ok(l, true))); }
  (c.triggers || []).filter(t => ['guidance', 'demand', 'util', 'pricing'].includes(t.t) && t.q).forEach(t => ok('“' + t.q + '”', true));
  const seen = new Set(); return out.filter(x => !seen.has(x.l) && seen.add(x.l)).sort((a, b) => b.next - a.next);
}
/* Near-term strength: no separate score. A company is listed when its latest call shows at least two strong
   near-term signals, or the Growth & capacity part of its Concall Signal Score is high. */
const growthPart = c => (c.breakdown?.parts || []).find(p => p.key === 'backed');
function ntRow(c) {
  const call = (D.calls || []).find(x => x.id === c.id && x.period === c.period) || {};
  const b = c.blocks || {}, gp = growthPart(c);
  if (c.veto || (b.guidance || 0) < 0 || (b.demand || 0) < 0 || call.gCut > 0) return null;
  const why = [];
  const gr = c.growth, near = (gr?.adds || []).filter(a => a.status !== 'deferred' && a.q != null && a.q <= 3 && a.mat !== 'minor');
  if (near.length) { const sz = near.reduce((n, a) => n + (a.size_pct || 0), 0); why.push([`Capacity live within 3 quarters${sz ? ` (~${Math.round(sz)}% of capacity)` : ''}`, 1]); }
  if (gr?.growth != null && gr.growth >= 15) why.push([`Growth guided ~${Math.round(gr.growth)}%`, 1]);
  if (gr?.turnaround && gr.gs >= 1) why.push(['Turnaround guided', 1]);
  if (gr?.clarity === 'clear') why.push(['Clear plan to deliver', 1]);
  if (gr && (gr.qRev >= 20 || gr.qEbitda >= 25)) why.push([`Strong quarter (rev ${pctTxt(gr.qRev)}, EBITDA ${pctTxt(gr.qEbitda)})`, 1]);
  if (b.guidance >= 2) why.push(['Guidance strongly positive', 1]); else if (b.guidance === 1) why.push(['Guidance positive', 0]);

      <div><b>Results calendar</b><span>The days each company’s board meets to approve its quarterly results, with its announced earnings call and the score of its last concall.</span></div>
      <div><b>Results posted</b><span>A sortable table of quarterly results as they are filed: revenue, operating profit, margin, profit and EPS, each with growth on last year and last quarter.</span></div>
      <div><b>First-time callers</b><span>Companies holding their first-ever earnings call. Useful for finding names before they get coverage.</span></div>
      <div><b>Sector tracker</b><span>All sectors and sub-sectors: how many companies have reported, what came in today, average score, guidance and best call. Updated daily.</span></div>
      <div><b>Guidance leaders</b><span>Sub-sectors ranked by how strongly management is guiding up, and the weakest ones.</span></div>

    </div></section>
    <section id="h-quarter"><h3>The quarter switch</h3><p>${esc(GL.quarter[1])} A small orange dot marks a season still in progress.</p></section>
    <section id="h-score"><h3>How the score works</h3>
      <p>The Concall Signal Score runs from 0 to 100. The model reads the call into eight readings, each from −2 to +2, plus a growth reading (growth or turnaround guided, how management plans to deliver it, capacity coming live, utilisation, this quarter’s growth), and they are combined with these weights:</p>
      <div class="weights">${W.map(([n, w]) => `<div class="w"><span>${n}</span><span class="sbar"><i style="width:${w / 30 * 100}%"></i></span><span class="num">${w}</span></div>`).join('')}</div>
      <ul><li>For a company’s first call in our data, the score reflects where the business stands now. From the second call on, 60% is the level and 40% is the change since last call.</li>
      <li>Guidance counts for more when management has delivered past guidance. With no track record yet (“untested”), guidance counts only 85% of its distance from neutral. Every company’s exact working is on the <b>Score breakdown</b> tab of its panel.</li>

      <p class="muted">Scores are relative. Most calls land between 45 and 65, so a 70 is a top-5% call. The percentile in each company panel shows where a call ranks within its quarter.</p></section>
    <section id="h-data"><h3>Data and timing</h3><ul>
      <li><b>Source:</b> BSE corporate filings. Each call has a link to its original transcript PDF in the company panel.</li>
      <li><b>When it updates:</b> the engine reads new filings at about 8 pm IST, and this page refreshes at about 7 am IST.</li>
      <li><b>Why a recent call may be missing:</b> SEBI gives companies five working days to file a transcript. Until it is filed, the call cannot be read. Some companies post only the audio.</li>
      <li><b>Quotes are checked:</b> every quote shown is matched word for word against the transcript. Unverified quotes are dropped.</li>
      <li><b>Classification:</b> sectors and sub-sectors follow BSE’s official four-level classification.</li>

  </article>

}

  const aex = t.closest('[data-askex]'); if (aex) { const q = $('#ask-q'); if (q) q.value = aex.dataset.askex; S.ask.q = aex.dataset.askex; askRun(ASK.sample === null ? 'keyword' : 'ai'); return; }
  const atab = t.closest('[data-asktab]'); if (atab) { S.ask.tab = atab.dataset.asktab; paintAsk(); return; }
  const ifs = t.closest('[data-ifs]'); if (ifs) { S.inf.side = ifs.dataset.ifs; S.inf.limit = 30; render(); return; }
  const ifc = t.closest('[data-ifc]'); if (ifc) { const k = ifc.dataset.ifc; S.inf[k] = !S.inf[k]; S.inf.limit = 30; render(); return; }
  if (t.closest('#if-more')) { S.inf.limit += 30; render(); return; }
  const it = t.closest('[data-it]'); if (it) { S.ideas.tab = it.dataset.it; render(); return; }
  const sec = t.closest('.trk .r.sec'); if (sec) { const n = S._secs[+sec.dataset.sec].name; S.openSec.has(n) ? S.openSec.delete(n) : S.openSec.add(n); render(); return; }
  const sub = t.closest('.trk .r.subr'); if (sub) { const [i, j] = sub.dataset.subrow.split('-').map(Number), n = S._secs[i].subs[j].name; S.openSub = S.openSub === n ? null : n; render(); return; }
  const dq = t.closest('#dr-q button'); if (dq) { S.drawer.key = dq.dataset.k; drawDrawer(false); return; }
  const dt = t.closest('[data-dt]'); if (dt) { S.drawer.tab = dt.dataset.dt; drawDrawer(false); return; }
  if (t.closest('#copylink')) { copyLink(); return; }
  const j = t.closest('[data-jump]'); if (j) { e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'}); return; }
});
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { e.stopPropagation(); if (S.drawer) closeCo(); go(b.dataset.v); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-how]')) store.set('how-' + d.dataset.how, d.open); }, true);
document.addEventListener('input', e => {
  for (const [id, st] of [['rc-search', S.rc], ['rs-search', S.rs]]) if (e.target.id === id) { const pos = e.target.selectionStart; st.search = e.target.value; render(); const i = $('#' + id); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }
  if (e.target.id === 'up-search') { const v = e.target.value, pos = e.target.selectionStart; S.up.search = v; render(); const i = $('#up-search'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }
  if (e.target.id === 'c-search') { S.calls.search = e.target.value; S.calls.limit = 50; fillCalls(); }
  if (e.target.id === 'find') { findSel = 0; renderFind(); }
  if (e.target.id === 'ask-q') S.ask.q = e.target.value;
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'c-big') { S.calls.big = e.target.value; S.calls.sub = ''; S.calls.limit = 50; render(); }
  if (id === 'c-sub') { S.calls.sub = e.target.value; S.calls.limit = 50; render(); }
  if (id === 'c-size') { S.calls.size = e.target.value; S.calls.limit = 50; render(); }
  if (id === 'mg-days') { S.mg.days = +e.target.value; render(); }
  if (id === 'up-big') { S.up.big = e.target.value; render(); }
  if (id === 'up-days') { S.up.days = +e.target.value; render(); }
  if (id === 'rc-big') { S.rc.big = e.target.value; render(); }
  if (id === 'rc-days') { S.rc.days = +e.target.value; render(); }
  if (id === 'rs-big') { S.rs.big = e.target.value; S.rs.limit = 100; render(); }
  if (id === 'rs-days') { S.rs.days = +e.target.value; S.rs.limit = 100; render(); }
  if (id === 'nt-big') { S.near.big = e.target.value; S.near.limit = 30; render(); }
  if (id === 'if-big') { S.inf.big = e.target.value; S.inf.limit = 30; render(); }
  if (id === 'ask-scope') S.ask.scope = e.target.value;
  if (id === 'ask-big') S.ask.big = e.target.value;
  if (id === 'ask-depth') S.ask.depth = +e.target.value;
  if (id === 'c-sort') { S.calls.sort = e.target.value; S.calls.limit = 50; fillCalls(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#pop').hidden) { hideTip(); return; } if (!$('#findres').hidden) { $('#findres').hidden = true; return; } if (S.drawer) { closeCo(); return; } }
  if (e.target.id === 'find' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    const items = [...$('#findres').querySelectorAll('button')]; if (!items.length) return;
    if (e.key === 'Enter') { e.preventDefault(); items[findSel]?.click(); return; }
    e.preventDefault(); findSel = (findSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; renderFind(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.trk .r.sec')) { e.preventDefault(); e.target.click(); }
  if (e.target.id === 'ask-q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askRun(ASK.sample === null ? 'keyword' : 'ai'); return; }
  if (e.key === '/' && !e.target.closest('input,select,textarea')) { e.preventDefault(); $('#find').focus(); }
  if (e.key === 'Tab' && S.drawer) { const f = [...$('.drawer').querySelectorAll('button,a,input,select,[tabindex="0"]')].filter(x => x.offsetParent);
    if (!f.length) return; if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); } }
});
$('#find').addEventListener('focus', renderFind);

/* ---------- boot ---------- */
(async function boot() {
  renderNav();
  let ok = false;
  try { const r = await fetch('data/in.json', {cache: 'no-store'}); if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.companies)) { D = j; ok = true; } } } catch (e) {}
  if (!ok) { $('#view').innerHTML = '<div class="empty">The latest results could not be loaded. Reload the page to try again.</div>'; return; }
  D.companies.forEach(c => { byId[c.id] = c; });
  const h = location.hash.slice(1);
  S.view = RENDER[h] ? h : (RENDER[store.get('view', 'home')] ? store.get('view', 'home') : 'home');
  render();
  if (h.startsWith('co-') && byId[h.slice(3)]) openCo(h.slice(3));
  loadSums().then(() => renderNav());  /* near-term count uses lines from the summaries */
  loadRes().then(() => { renderNav(); if (['rescal', 'results', 'home', 'watch', 'upcoming'].includes(S.view)) render(); });
})();
</script>
