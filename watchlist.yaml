# Results watchlist (India): companies whose results dates are highlighted on the dashboard and alerted
# ahead of time. Board meeting dates come from BSE's forthcoming-results list, checked every 30 minutes
# (mgmt.yml). When a watched company's results meeting is `lead_days` days away or closer, a GitHub issue
# labelled results-watch is opened once for that date (again if the date moves), so GitHub notifies the owner.
# Every listed company is in the universe now, so watchlist companies get their concalls read as well.
# To add a company: its BSE scrip code and name. `as` is the name it was given in the request.
