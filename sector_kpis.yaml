# Sector KPI models for the Sector KPI read (kpis.py → analyze.py → dashboard "Sector KPIs").
#
# Source: "Sector Taxonomy" sheet of sector_scoring_methodology_v1.xlsx (60 sub-sectors and their
# fundamental KPIs). Models marked `source: desk` are additions for BSE sub-sectors the workbook does not
# cover, built from the workbook's Factor Library pillars. "General" is the fallback for everything else.
#
# Each KPI: [key, label, better]   better = up (higher is better) | down (lower is better) | mixed (judge in context)
# When `better` is up or down, the engine sets the KPI's effect from the direction the call reports, so the
# model cannot mark "GNPA rose" as an improvement. For `mixed` KPIs the model's own judgement of the effect is used.
#
# `match` maps BSE's classification (industry, then sub-sector) to a model: first rule whose keyword is a
# case-insensitive substring wins. Edit freely; the next nightly run re-reads calls whose model changed.

