# Sector leaders: 2 Indian + 2 global bellwethers per sector, whose results, calls and decks are tracked
# event by event (python run.py leaders). Indian leaders are keyed by BSE code. Global leaders by Yahoo ticker,
# with `sec` set when the company files with the SEC (8-K, or 6-K for foreign issuers), which gives free,
# complete filing coverage.
#
# cadence:  quarterly     full results every quarter (default)
#           half+updates  full results each half; Q1/Q3 are trading or sales updates
#           half          half-yearly reporting only
# call:     false when the company holds no analyst call for that kind of event (e.g. operational reviews)
# fy_end:   last month of the fiscal year (default 12); fy_label: 'end' (FY2027 = year ending in 2027) or 'start'
# ir:       the company's results page, scanned for presentation / transcript PDFs (filled from a checked list)
# Add or swap names freely; the dashboard and the completeness ledger follow this file.

- sector: Private Banks
  watch: Credit growth vs deposit growth, NIM, slippages and credit cost
  india:
    - {code: "500180", name: HDFC Bank}
