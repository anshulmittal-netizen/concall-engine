name: Sector leaders

on:
  schedule:
    - cron: "40 1 * * *"    # 07:10 IST: US and European results from the previous day
    - cron: "10 16 * * *"   # 21:40 IST: Indian results, calls and decks filed during the day
  workflow_dispatch:
    inputs:
      limit:
        description: "Max leader documents to read this run (blank = settings.yaml, 0 = collect only)"
        required: false

concurrency: { group: engine-data, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: { contents: write }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}   # optional: global earnings-call transcripts
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/cache@v4
        with:
          path: cache
          key: raw-leaders-${{ github.run_id }}
          restore-keys: raw-leaders-
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Collect, read, rebuild
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="--limit ${{ inputs.limit }}"; fi
          python run.py leaders $ARGS
      - name: Commit results
        if: always()
        run: |
          git config user.name "concall-engine"
          git config user.email "concall-engine@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Sector leaders $(date -u +%F)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; echo "Rebase conflict with main"; exit 1; }
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $i); main moved, retrying"
            sleep $((i * 5))
          done
          exit 1
