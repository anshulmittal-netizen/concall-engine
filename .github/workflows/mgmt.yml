name: Management changes

on:
  schedule:
    - cron: "*/30 3-17 * * *"   # every 30 minutes, 08:30-23:00 IST
  workflow_dispatch:
    inputs:
      days:
        description: "Days of filings to read (backfill)"
        required: false
        default: "2"

concurrency: { group: mgmt-watch, cancel-in-progress: false }   # own group: never waits behind the nightly run

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions: { contents: write, issues: write }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Read new management-change filings
        run: python run.py mgmt --market IN --days ${{ inputs.days || '2' }}
      - name: Commit
        if: always()
        run: ./mgmt_commit.sh
