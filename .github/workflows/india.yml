name: India concalls

on:
  schedule:
    - cron: "25 14 * * *"   # 19:55 IST daily
  workflow_dispatch:
    inputs:
      since:
        description: "Fetch from date (YYYY-MM-DD). Blank = automatic window"
        required: false
      limit:
        description: "Max documents to extract this run"
        required: false
      only_summaries:
        description: "Only summaries + growth reads, then rebuild the site (no fetch or extract)"
        type: boolean
        default: false

concurrency: { group: engine-data, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: { contents: write }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/cache@v4
        with:
          path: cache
          key: raw-in-${{ github.run_id }}
          restore-keys: raw-in-
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Fetch, extract, analyze
        run: |
          ARGS=""
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.only_summaries }}" = "true" ]; then
            python run.py summarize --market IN && python run.py growth --market IN && python run.py analyze --market IN || { python run.py analyze --market IN; exit 1; }
            exit 0
          fi
          python run.py all --market IN $ARGS || { echo "Run failed; rebuilding results from saved reads"; python run.py analyze --market IN; exit 1; }
      - name: Commit results
        if: always()   # save whatever was read, even if a later step failed
        run: |
          git config user.name "concall-engine"
          git config user.email "concall-engine@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "India run $(date -u +%F)${{ inputs.only_summaries && ' (summaries)' || '' }}"
          # The 30-minute management/results watch pushes to main on its own schedule, so a push can lose
          # the race by a second or two. Re-sync and retry rather than throwing away the night's reads.
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; echo "Rebase conflict with main"; exit 1; }
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $i); main moved, retrying"
            sleep $((i * 5))
          done
          exit 1
