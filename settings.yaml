# Concall Signal Desk — engine settings (lean mode)

universe:
  india_mcap_cap_inr_cr: null # India reads every listed company, all market caps (set a number to cap it again)
  mcap_cap_inr_cr: 50000      # US cut-off (₹50,000 Cr at the live INR/USD rate)
  mcap_floor_inr_cr: 0
  mcap_floor_usd_mn: 0
  inr_per_usd_fallback: 88.0
  us_exchanges: [Nasdaq, NYSE, "NYSE American"]
  refresh_days: 7

inputs:
  india: [transcript]          # lean mode: transcripts only; add presentation later
  us: [transcript, presentation]

sources:
  india: bse
  us_presentations: edgar
  us_transcripts: none         # US is off for now
  interviews: watchlist

models:
  first_pass: claude-haiku-5-5
  escalate: claude-haiku-5-5   # lean mode: no stronger-model re-reads
  escalate_if_abs_block_sum_ge: 99
  escalate_if_verified_share_lt: 0.0
  max_tokens: 4096
  summary_max_tokens: 4000
  max_chars_per_doc: 320000    # keeps prompts under 100K tokens, where Haiku pricing steps up

run:
  max_docs_per_run: 300
  summaries: true              # detailed call summary for every transcript
  max_summaries_per_run: 300   # summary backlog cleared newest first, this many per night
  max_growth_reads_per_run: 1000 # growth & capacity reads (small: summary + quotes in, not the transcript)
  max_outlook_reads_per_run: 3000 # forward triggers for the next 2-4 quarters (small: summary in), run in parallel
  outlook_workers: 8
  max_about_per_run: 2000     # one-line 'what the business does' per company, written once (small: summary in)
  about_refresh_days: 365      # rewrite a company's line from a newer call after this many days
  max_completions_per_run: 700 # summaries missing sections get one targeted follow-up call, this many per night
  rescue_unreadable: true      # India: OCR scanned transcripts and follow cover-letter links to the company website
  max_ocr_minutes_per_run: 60  # wall-clock time for OCR per run (a few seconds a page); the rest wait for the next run
  rescue_days: 120             # filings this recent that failed before get one more try with the above
  audio_recordings: true       # India: transcribe filed concall recordings (needs rescue_unreadable) so calls score before the transcript is filed
  max_audio_minutes_per_run: 180 # wall-clock time for transcription per run; the rest wait for the next run (raised from 120 for the results peak)
  max_recording_minutes: 150   # skip recordings longer than this
  whisper_model: small         # faster-whisper model on the CPU runner (tiny/base are faster, medium is more accurate)
  backfill_days: 200           # current + previous quarter
  lookback_days: 10

analysis:
  periods_shown: 6
  min_companies_per_sector: 3
  divergence_points: 15
  first_mover_count: 5
  hidden_supplier_min_mentions: 2
  credibility_upgrade_min: 70

leaders:                      # sector leaders tracker (leaders.yaml, python run.py leaders)
  max_reads_per_run: 150      # leader calls / releases / decks read per run, newest season first
  weights: {tone: 0.4, guid: 0.3, num: 0.3}   # management tone, guidance, reported numbers
  improve_pts: 10             # latest score vs the average of the earlier seasons, in points (−100..100)
  deteriorate_pts: 10
